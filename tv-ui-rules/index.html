<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />

<title>【V0.2】小镇电视台 · 界面规则展示版</title>
<style>
:root {
  --bg: #f4f6f3;
  --paper: #fffaf0;
  --panel: #ffffff;
  --ink: #1f2a37;
  --muted: #697386;
  --line: #d7dfdf;
  --brand: #d6523c;
  --brand-dark: #a5372b;
  --sage: #dce9df;
  --sky: #d8eef3;
  --warm: #ffe5ae;
  --shadow: 0 18px 40px rgba(55, 64, 67, .13);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 "Inter", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button {
  border: 0;
  border-radius: 7px;
  padding: 8px 12px;
  background: #23364d;
  color: #fff;
  cursor: pointer;
}
button.secondary { background: #eef2f5; color: #243040; border: 1px solid var(--line); }
button.ghost { background: transparent; color: #2c475d; border: 1px solid var(--line); }
button.danger { background: #b63c32; }
.app {
  display: grid;
  grid-template-columns: 288px 1fr;
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
  padding: 22px 18px;
  background: #182331;
  color: #e9f0f6;
}
.brand {
  padding: 14px 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin-bottom: 18px;
}
.brand .eyebrow { color: #9fb5c9; font-size: 12px; letter-spacing: .05em; }
.brand h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.2; }
.side-title { margin: 18px 8px 8px; color: #9fb5c9; font-size: 12px; }
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0;
  padding: 9px 10px;
  color: #d9e5ef;
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
}
.nav-item:hover, .nav-item.active {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.11);
}
.nav-id {
  min-width: 52px;
  color: #ffd991;
  font-variant-numeric: tabular-nums;
}
.main {
  padding: 34px 38px 70px;
}
.hero {
  padding: 30px 34px;
  border-radius: 16px;
  background: linear-gradient(105deg, var(--warm), #edf0d9 48%, var(--sky));
  box-shadow: var(--shadow);
  margin-bottom: 26px;
}
.hero h2 { margin: 0; font-size: 34px; letter-spacing: 0; }
.hero p { margin: 8px 0 0; color: #4d5d6b; max-width: 880px; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 16px 0 0;
}
.view { display: none; }
.view.active { display: block; }
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}
.overview-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 10px 22px rgba(31,42,55,.06);
  cursor: pointer;
}
.overview-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.overview-card h3 { margin: 0 0 10px; font-size: 18px; }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: #eef4f4;
  color: #3d5363;
  font-size: 12px;
  white-space: nowrap;
}
.thumb-strip { display: flex; gap: 8px; overflow: hidden; height: 150px; margin: 12px 0; }
.thumb-strip img {
  height: 150px;
  width: auto;
  border-radius: 8px;
  border: 1px solid #dce3e5;
  background: #f3f5f5;
}
.empty-thumb {
  display: grid;
  place-items: center;
  height: 150px;
  width: 110px;
  border-radius: 8px;
  background: repeating-linear-gradient(135deg, #f1f3f4, #f1f3f4 10px, #e8ecef 10px, #e8ecef 20px);
  color: #7b8794;
}
.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.detail-head h2 { margin: 0; font-size: 28px; }
.screen-block {
  background: var(--paper);
  border: 1px solid #ead9b7;
  border-radius: 14px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 12px 14px 0 rgba(221, 202, 160, .38);
}
.screen-title {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
  padding: 12px 18px;
  border-radius: 10px;
  background: linear-gradient(100deg, #ffe8ac, #edf0d7 48%, #d7eff5);
}
.screen-title h3 { margin: 0; font-size: 20px; }
.workspace {
  display: grid;
  grid-template-columns: minmax(300px, 500px) minmax(320px, 1fr);
  gap: 22px;
  align-items: start;
}
.image-stage {
  background: #f8f1e5;
  border: 1px solid #e3d1ad;
  border-radius: 10px;
  padding: 16px;
}
.image-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.image-tabs button { padding: 6px 10px; background: #e9edf0; color: #2f4050; }
.image-tabs button.active { background: #25384e; color: #fff; }
.image-wrap {
  position: relative;
  display: inline-block;
  max-width: 100%;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #d6dcdd;
}
.image-wrap img {
  display: block;
  max-width: 100%;
  max-height: 760px;
  object-fit: contain;
}
.marker {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  line-height: 1;
  text-align: center;
  font-weight: 800;
  font-size: 13px;
  border: 3px solid #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,.24);
  cursor: pointer;
  touch-action: none;
  user-select: none;
}
.marker.dragging { cursor: grabbing; }
.marker.active { background: #c7352c; outline: 4px solid rgba(255, 207, 87, .95); box-shadow: 0 0 0 7px rgba(255, 207, 87, .24), 0 6px 14px rgba(0,0,0,.28); }
.rule-panel {
  display: grid;
  gap: 12px;
}
.rule-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}
.segmented {
  display: inline-flex;
  padding: 3px;
  border-radius: 9px;
  background: #eef2f5;
  border: 1px solid var(--line);
}
.segmented button {
  background: transparent;
  color: #2f4050;
  border-radius: 7px;
  padding: 6px 10px;
}
.segmented button.active {
  background: #23364d;
  color: #fff;
}
.point-tabs {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.point-tabs button {
  background: #fff;
  color: #32465b;
  border: 1px solid #d5dde1;
  min-width: 42px;
  padding: 7px 10px;
}
.point-tabs button.active {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
.rule-panel.mode-point .point-tabs { display: flex; }
.rule-panel.mode-point .rule-card { display: none; }
.rule-panel.mode-point .rule-card.active { display: block; }
.rule-card {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 14px;
}
.rule-card.active {
  background: #fff3cf;
  border-color: #e09f2d;
  box-shadow: 0 0 0 5px rgba(224,159,45,.28), 0 12px 28px rgba(115, 86, 24, .14);
}
.rule-head {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.rule-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  flex: 0 0 auto;
}
.rule-card input, .rule-card textarea {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fbfcfd;
  color: var(--ink);
}
.rule-card textarea { min-height: 180px; resize: vertical; }
.rule-meta {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto;
  gap: 8px;
  align-items: center;
  margin: 10px 0;
}
.rule-meta select {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fbfcfd;
  color: var(--ink);
}
.action-links {
  margin: 10px 0;
  border: 1px solid #d5dde1;
  border-radius: 10px;
  background: #fbfcfd;
  padding: 10px;
}
.action-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}
.action-list {
  display: grid;
  gap: 8px;
}
.action-row {
  display: grid;
  grid-template-columns: minmax(120px, .7fr) minmax(180px, 1.3fr) auto auto;
  gap: 8px;
  align-items: center;
}
.action-row input,
.action-row select {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fff;
  color: var(--ink);
}
.action-empty {
  color: #7b8794;
  font-size: 13px;
}
.extra-attachment {
  margin: 10px 0;
  border: 1px solid #d5dde1;
  border-radius: 10px;
  background: #fbfcfd;
  overflow: hidden;
}
.extra-attachment.drag-over {
  border-color: #2f7d55;
  box-shadow: 0 0 0 4px rgba(47,125,85,.14);
}
.extra-summary {
  display: grid;
  grid-template-columns: auto minmax(120px, 1fr) auto auto auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
}
.extra-count {
  font-size: 13px;
  font-weight: 800;
  color: #5c6b7b;
  white-space: nowrap;
}
.extra-preview-strip {
  display: flex;
  gap: 6px;
  min-height: 34px;
  align-items: center;
  overflow: hidden;
}
.extra-preview-strip img {
  width: 42px;
  height: 32px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #d5dde1;
  background: #f4f6f7;
}
.extra-preview-empty {
  color: #8b97a5;
  font-size: 13px;
}
.extra-panel {
  display: none;
  border-top: 1px solid #d5dde1;
  padding: 10px;
  background: #fff;
}
.extra-attachment.open .extra-panel { display: block; }
.extra-images {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}
.extra-image-card {
  width: 178px;
  padding: 8px;
  border: 1px solid #d5dde1;
  border-radius: 9px;
  background: #fbfcfd;
}
.extra-image-card:first-child {
  border-color: #d6523c;
  box-shadow: 0 0 0 3px rgba(214,82,60,.12);
}
.extra-image-card img {
  width: 100%;
  height: 104px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #d5dde1;
  background: #f4f6f7;
}
.extra-image-card textarea {
  min-height: 56px;
  margin-top: 6px;
  font-size: 13px;
}
.mini-toolbar {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.mini-toolbar button {
  padding: 5px 8px;
  font-size: 12px;
}
.paste-zone {
  min-height: 38px;
  padding: 8px 10px;
  border: 1px dashed #c8d2d8;
  border-radius: 8px;
  background: #fbfcfd;
  color: #697386;
  outline: none;
}
.paste-zone:focus {
  border-color: #d6523c;
  background: #fff6ef;
  color: #2c3542;
}
.paste-zone.drag-over {
  border-color: #2f7d55;
  background: #eefaf3;
  color: #23543b;
}
.reference-note {
  padding: 18px;
  border: 1px dashed #d5c298;
  border-radius: 10px;
  background: #fff7e7;
  color: #6b5a36;
}
.move-tip {
  display: none;
  margin: 10px 0 0;
  padding: 9px 12px;
  border-radius: 8px;
  background: #fff3cf;
  color: #7a4d06;
  border: 1px solid #efc76b;
}
.move-tip.active { display: block; }
.hint {
  color: var(--muted);
  font-size: 13px;
}
.empty-detail {
  padding: 32px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  background: #fff;
}
.file-input { display: none; }
@media (max-width: 680px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .workspace { grid-template-columns: 1fr; }
  .main { padding: 20px; }
}
</style>
<style>

</style>

const storageKey = "tv-ui-rules-html-prototype-v15";
const ruleContentVersion = seedData.ruleContentVersion || "object-first-rules-v2";
let state = clone(seedData);
let activeScreenId = null;
let activeImageIndex = 0;

function clone(value) { return JSON.parse(JSON.stringify(value)); }
function mergeRuleContentFromSeed(cached) {
  const next = clone(seedData);
  const cachedScreens = new Map((cached.interfaces || []).map(screen => [screen.id, screen]));

  for (const nextScreen of next.interfaces || []) {
    const cachedScreen = cachedScreens.get(nextScreen.id);
    if (!cachedScreen) continue;
    const cachedImages = new Map((cachedScreen.images || []).map(image => [image.id, image]));

    for (const nextImage of nextScreen.images || []) {
      const cachedImage = cachedImages.get(nextImage.id);
      if (!cachedImage) continue;
        if (cachedImage.src) nextImage.src = cachedImage.src;
        if (cachedImage.entryRule !== undefined) nextImage.entryRule = cachedImage.entryRule;
      const cachedMarkers = new Map((cachedImage.annotations || []).map(marker => [marker.id, marker]));

      for (const nextMarker of nextImage.annotations || []) {
        const cachedMarker = cachedMarkers.get(nextMarker.id);
        if (!cachedMarker) continue;
        nextMarker.x = cachedMarker.x ?? nextMarker.x;
        nextMarker.y = cachedMarker.y ?? nextMarker.y;
        nextMarker.extraImages = cachedMarker.extraImages || nextMarker.extraImages || [];
        nextMarker.targetImageId = cachedMarker.targetImageId || nextMarker.targetImageId || "";
          if (cachedMarker.title !== undefined) nextMarker.title = cachedMarker.title;
          if (cachedMarker.rule !== undefined) nextMarker.rule = cachedMarker.rule;
          nextMarker.linkActions = cachedMarker.linkActions || nextMarker.linkActions || [];
      }

      for (const cachedMarker of cachedImage.annotations || []) {
        if (!nextImage.annotations?.some(marker => marker.id === cachedMarker.id)) {
          nextImage.annotations.push(cachedMarker);
        }
      }
    }

    const knownImageIds = new Set((nextScreen.images || []).map(image => image.id));
    for (const cachedImage of cachedScreen.images || []) {
      if (!knownImageIds.has(cachedImage.id)) nextScreen.images.push(cachedImage);
    }
  }

  next.ruleContentVersion = ruleContentVersion;
  return next;
}
function loadState() {
  try {
    const cached = localStorage.getItem(storageKey);
    if (cached) {
      const parsed = JSON.parse(cached);
      const hasValidInterfaces = Array.isArray(parsed?.interfaces) && parsed.interfaces.length > 0;
      if (!hasValidInterfaces) {
        const backupKey = storageKey + "-invalid-" + Date.now();
        localStorage.setItem(backupKey, cached);
        localStorage.setItem(storageKey + "-last-invalid", backupKey);
        localStorage.removeItem(storageKey);
        throw new Error("Invalid cached state");
      }
      if (parsed && parsed.ruleContentVersion && parsed.ruleContentVersion !== ruleContentVersion) {
        const backupKey = storageKey + "-backup-" + parsed.ruleContentVersion + "-" + Date.now();
        localStorage.setItem(backupKey, cached);
        localStorage.setItem(storageKey + "-last-backup", backupKey);
      }
      if (parsed.ruleContentVersion !== ruleContentVersion) {
        const migrated = mergeRuleContentFromSeed(parsed);
        localStorage.setItem(storageKey, JSON.stringify(migrated));
        return migrated;
      }
      return parsed;
    }
  } catch (error) {}
  const fresh = clone(seedData);
  fresh.ruleContentVersion = ruleContentVersion;
  return fresh;
}
let lastSaveError = "";
function saveState() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    lastSaveError = "";
    return true;
  } catch (error) {
    lastSaveError = error?.message || "浏览器本地缓存保存失败。";
    console.warn("localStorage save failed:", error);
    return false;
  }
}
async function saveStateToLocalFile(button, options = {}) {
  const browserSaved = saveState();
  const endpoint = location.protocol === "file:" ? "http://127.0.0.1:5177/save-state" : "/save-state";
  const oldText = button?.textContent;
  if (button) {
    button.textContent = "保存中...";
    button.disabled = true;
  }
  try {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state }),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      throw new Error(result.message || "写回本地 HTML 失败。");
    }
    if (!options.silent) {
      alert(result.message + (browserSaved ? "" : "\n浏览器缓存空间不足，已跳过浏览器缓存；不影响重新打开本地 HTML 查看最新内容。"));
    }
    return { ok: true, browserSaved, result };
  } catch (error) {
    const message = (browserSaved ? "已保存到当前浏览器，但" : "浏览器缓存保存失败，且") + "未写回本地 HTML。\n" + (error?.message || "请确认本地服务已启动。");
    if (!options.silent) alert(message);
    return { ok: false, browserSaved, message };
  } finally {
    if (button) {
      button.textContent = oldText;
      button.disabled = false;
    }
  }
}
async function preparePublish(button) {
  const oldText = button?.textContent;
  if (button) {
    button.textContent = "发布准备中...";
    button.disabled = true;
  }
  try {
    const saved = await saveStateToLocalFile(null, { silent: true });
    if (!saved.ok) {
      throw new Error(saved.message || "保存失败，已停止发布准备。");
    }
    const endpoint = location.protocol === "file:" ? "http://127.0.0.1:5177/prepare-publish" : "/prepare-publish";
    const response = await fetch(endpoint, { method: "POST" });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      throw new Error(result.message || "准备发布失败。");
    }
    alert(result.message + "\n\n提交号：" + result.commitSha + "\n下一步：在 Codex 对话里告诉我“继续发布线上版本”，我会发布到同一个线上链接。");
  } catch (error) {
    alert("发布准备失败。\n" + (error?.message || "请确认本地服务已启动。"));
  } finally {
    if (button) {
      button.textContent = oldText;
      button.disabled = false;
    }
  }
}
function pad2(n) { return String(n).padStart(2, "0"); }
function byId(id) { return document.getElementById(id); }

function normalizeMarkerActions(marker) {
  if (!marker) return [];
  const actions = Array.isArray(marker.linkActions) ? marker.linkActions : [];
  marker.linkActions = actions
    .map((action, index) => ({
      label: action?.label || ("点击动作 " + (index + 1)),
      targetImageId: action?.targetImageId || action?.target || "",
    }))
    .filter(action => action.label || action.targetImageId);
  if (!marker.linkActions.length && marker.targetImageId) {
    marker.linkActions.push({ label: "点击动作 1", targetImageId: marker.targetImageId });
  }
  syncLegacyTarget(marker);
  return marker.linkActions;
}
function syncLegacyTarget(marker) {

function renderNav() {

  '<section class="screen-block">' +
    '<div class="screen-title"><h3>' + escapeHtml(screenTitle(screen)) + '</h3><span class="tag">' + escapeHtml(screen.groupId || "未分组") + '</span></div>' +
    (image ? renderImageWorkspace(screen, image) : renderEmptyImage(screen)) +
  '</section>';
  view.querySelector("[data-back]").addEventListener("click", () => { activeScreenId = null; renderOverview(); renderNav(); });
  bindDetailEvents(screen);
}

function renderEmptyImage(screen) {
  return '<div class="empty-detail">' +
    '<p>这个界面还没有图片。可以先上传一张本地图片用于标注。</p>' +
    '<button data-upload-image>上传图片</button><input class="file-input" type="file" accept="image/*" data-upload-input />' +
  '</div>';
}

function renderImageWorkspace(screen, image) {

    '<button class="marker ' + (marker.id === activeMarkerId ? 'active' : '') + '" style="left:' + marker.x + '%;top:' + marker.y + '%" data-marker="' + escapeAttr(marker.id) + '">' + escapeHtml(marker.id) + '</button>'
  ).join("");
  const pointTabs = [{ id: "0", title: "入口规则" }].concat(image.annotations).map(marker =>
    '<button class="' + (marker.id === activeMarkerId ? 'active' : '') + '" data-rule-tab="' + escapeAttr(marker.id) + '">' + escapeHtml(marker.id) + '</button>'
  ).join("");
  const rules = image.annotations.map(marker => {
    const normalizedExtras = (marker.extraImages || []).map(item => typeof item === "string" ? { src: item, note: "" } : item);
    marker.extraImages = normalizedExtras;
    const linkActions = normalizeMarkerActions(marker);

    const extraImages = normalizedExtras.map((item, index) =>

        '<img src="' + item.src + '" alt="' + escapeAttr(marker.title + "效果图" + (index + 1)) + '" />' +
        '<textarea data-extra-note="' + escapeAttr(marker.id) + '" data-extra-index="' + index + '" placeholder="补充这张效果图说明">' + escapeHtml(item.note || "") + '</textarea>' +
        '<div class="mini-toolbar"><button class="ghost" data-insert-extra-ref="' + escapeAttr(marker.id) + '" data-extra-index="' + index + '">插入引用</button><button class="danger" data-delete-extra="' + escapeAttr(marker.id) + '" data-extra-index="' + index + '">删除</button></div>' +
      '</div>'
    ).join("");
    const actionRows = linkActions.map((action, index) =>
      '<div class="action-row" data-action-row="' + escapeAttr(marker.id) + '" data-action-index="' + index + '">' +
        '<input data-action-label="' + escapeAttr(marker.id) + '" data-action-index="' + index + '" value="' + escapeAttr(action.label || "") + '" placeholder="动作名，如点击详情" />' +
        '<select data-action-target="' + escapeAttr(marker.id) + '" data-action-index="' + index + '">' + buildTargetImageOptions(action.targetImageId || "") + '</select>' +
        '<button class="ghost" data-jump-action="' + escapeAttr(marker.id) + '" data-action-index="' + index + '">查看</button>' +
        '<button class="danger" data-delete-action="' + escapeAttr(marker.id) + '" data-action-index="' + index + '">删除</button>' +
      '</div>'
    ).join("");
    return '<article class="rule-card ' + (marker.id === activeMarkerId ? 'active' : '') + '" data-rule="' + escapeAttr(marker.id) + '" data-rule-drop="' + escapeAttr(marker.id) + '">' +
      '<div class="rule-head"><span class="rule-num">' + escapeHtml(marker.id) + '</span><input data-edit-title="' + escapeAttr(marker.id) + '" value="' + escapeAttr(marker.title) + '" /></div>' +
      '<textarea data-edit-rule="' + escapeAttr(marker.id) + '">' + escapeHtml(marker.rule) + '</textarea>' +
      '<div class="action-links">' +
        '<div class="action-head"><strong>动作跳转</strong><button class="secondary" data-add-action="' + escapeAttr(marker.id) + '">新增动作</button></div>' +
        '<div class="action-list">' + (actionRows || '<div class="action-empty">暂无动作。可添加多个点击区域或点击效果，并分别绑定目标界面。</div>') + '</div>' +
      '</div>' +
      '<div class="extra-attachment ' + (isExtraOpen ? "open" : "") + '" data-extra-attachment="' + escapeAttr(marker.id) + '">' +
        '<div class="extra-summary">' +
          '<span class="extra-count">效果图 ' + normalizedExtras.length + ' 张</span>' +
          '<div class="extra-preview-strip">' + previewStrip + '</div>' +
          '<button class="ghost" data-toggle-extra-panel="' + escapeAttr(marker.id) + '">' + (isExtraOpen ? "收起" : "展开") + '</button>' +
          '<button class="secondary" data-upload-extra="' + escapeAttr(marker.id) + '">上传图片</button><input class="file-input" type="file" accept="image/*" data-extra-input="' + escapeAttr(marker.id) + '" />' +
          '<button class="secondary" data-system-clipboard="' + escapeAttr(marker.id) + '">从系统剪贴板导入</button>' +
        '</div>' +
        '<div class="extra-panel">' +
          '<div class="extra-images">' + (extraImages || '<p class="hint">暂无效果图。可以上传图片、拖拽图片到下方区域，或使用系统剪贴板导入。</p>') + '</div>' +
          '<div class="paste-zone" tabindex="0" role="button" data-paste-zone="' + escapeAttr(marker.id) + '">复制截图后点这里按 Ctrl+V；localhost 模式会自动读取系统剪贴板</div>' +
        '</div>' +
      '</div>' +
      '<div class="toolbar"><button class="ghost" data-focus-marker="' + escapeAttr(marker.id) + '">定位标注</button><button class="secondary" data-move-marker="' + escapeAttr(marker.id) + '">调整位置</button><button class="danger" data-delete-marker="' + escapeAttr(marker.id) + '">删除标注</button></div>' +
    '</article>';
  }).join("");
  return '<div class="workspace">' +
    '<div class="image-stage">' +
      '<div class="image-tabs">' + tabs + '<button class="secondary" data-upload-image>上传/追加图片</button><input class="file-input" type="file" accept="image/*" data-upload-input /></div>' +
      '<div class="image-wrap" data-image-wrap><img src="' + image.src + '" alt="' + escapeAttr(screen.name) + '" />' + markers + '</div>' +
      '<div class="move-tip ' + (moveMarkerId ? 'active' : '') + '">正在调整 ' + escapeHtml(moveMarkerId || "") + '：点击截图目标位置，或直接拖动红色标点。</div>' +
      '<p class="hint">点击图片空白处可新增标注；可直接拖动标点调整位置；规则卡片内可上传图片，也可以先点击粘贴框再 Ctrl+V 粘贴截图。</p>' +
    '</div>' +
    '<div class="rule-panel mode-' + ruleDisplayMode + '">' +
      '<div class="rule-toolbar">' +
        '<div class="toolbar"><button data-add-marker>新增标注</button><button class="secondary" data-renumber-markers>整理编号</button><button class="secondary" data-save>保存修改</button></div>' +
        '<div class="segmented"><button class="' + (ruleDisplayMode === "overview" ? "active" : "") + '" data-rule-display="overview">总览</button><button class="' + (ruleDisplayMode === "point" ? "active" : "") + '" data-rule-display="point">分点</button></div>' +
      '</div>' +
      '<div class="point-tabs">' + pointTabs + '</div>' +
      (image.role === "参考图" ? '<div class="reference-note">这张图标记为参考图：只用于对标或说明，不生成标点和规则。</div>' : '<div class="rule-card ' + (activeMarkerId === "0" ? "active" : "") + '" data-rule="0"><div class="rule-head"><span class="rule-num">0</span><strong>入口规则</strong></div><textarea data-entry-rule>' + escapeHtml(image.entryRule || "待补充：说明如何进入当前界面。") + '</textarea></div>') +
      rules +
    '</div>' +
  '</div>';
}

function bindDetailEvents(screen) {
  const image = screen.images[activeImageIndex];
  if (!image) {
    const upload = document.querySelector("[data-upload-input]");
    document.querySelector("[data-upload-image]").addEventListener("click", () => upload.click());
    upload.addEventListener("change", event => handleUpload(screen, event));
    return;
  }
  document.querySelectorAll("[data-image-index]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeImageIndex = Number(btn.dataset.imageIndex);
      activeMarkerId = screen.images[activeImageIndex].annotations[0]?.id || "01";
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-marker], [data-focus-marker]").forEach(el => {
    el.addEventListener("click", event => {
      event.stopPropagation();
      const id = el.dataset.marker || el.dataset.rule || el.dataset.focusMarker;
      if (id) {
        activeMarkerId = id;
        activeMarkerId = marker.id;
        renderDetail(screen.id);
      }
    });
  });
  document.querySelectorAll("[data-marker]").forEach(markerEl => {
    markerEl.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();
      const marker = image.annotations.find(item => item.id === markerEl.dataset.marker);
      if (!marker) return;
      activeMarkerId = marker.id;
      markerEl.classList.add("dragging");
      markerEl.setPointerCapture(event.pointerId);
      const move = moveEvent => {
        const rect = wrap.getBoundingClientRect();
        const x = ((moveEvent.clientX - rect.left) / rect.width) * 100;
        const y = ((moveEvent.clientY - rect.top) / rect.height) * 100;
        marker.x = Number(Math.max(0, Math.min(100, x)).toFixed(2));
        marker.y = Number(Math.max(0, Math.min(100, y)).toFixed(2));
        markerEl.style.left = marker.x + "%";
        markerEl.style.top = marker.y + "%";
      };
      const up = upEvent => {
        markerEl.classList.remove("dragging");
        markerEl.releasePointerCapture(upEvent.pointerId);
        markerEl.removeEventListener("pointermove", move);
        markerEl.removeEventListener("pointerup", up);
        markerEl.removeEventListener("pointercancel", up);
        moveMarkerId = null;
        saveState();
        renderDetail(screen.id);
      };
      markerEl.addEventListener("pointermove", move);
      markerEl.addEventListener("pointerup", up);
      markerEl.addEventListener("pointercancel", up);
    });
  });
  document.querySelectorAll("[data-rule-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeMarkerId = btn.dataset.ruleTab;
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-action-label]").forEach(input => {
    input.addEventListener("input", () => {
      const marker = image.annotations.find(item => item.id === input.dataset.actionLabel);
      const index = Number(input.dataset.actionIndex);
      const actions = normalizeMarkerActions(marker);
      if (!actions[index]) return;
      actions[index].label = input.value;
      syncLegacyTarget(marker);
      saveState();
    });
  });
  document.querySelectorAll("[data-action-target]").forEach(select => {
    select.addEventListener("change", () => {
      const marker = image.annotations.find(item => item.id === select.dataset.actionTarget);
      const index = Number(select.dataset.actionIndex);
      const actions = normalizeMarkerActions(marker);
      if (!actions[index]) return;
      actions[index].targetImageId = select.value;
      syncLegacyTarget(marker);
      saveState();
    });
  });
  document.querySelectorAll("[data-jump-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const marker = image.annotations.find(item => item.id === btn.dataset.jumpAction);
      const index = Number(btn.dataset.actionIndex);
      const action = normalizeMarkerActions(marker)[index];
      if (!action?.targetImageId) return;
      jumpToTargetImage(action.targetImageId, marker.id, screen);
    });
  });
  document.querySelectorAll("[data-delete-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const marker = image.annotations.find(item => item.id === btn.dataset.deleteAction);
      const index = Number(btn.dataset.actionIndex);
      const actions = normalizeMarkerActions(marker);
      actions.splice(index, 1);
      syncLegacyTarget(marker);
      activeMarkerId = marker.id;
      saveState();
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-add-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const marker = image.annotations.find(item => item.id === btn.dataset.addAction);
      const actions = normalizeMarkerActions(marker);
      actions.push({ label: "点击动作 " + (actions.length + 1), targetImageId: "" });
      activeMarkerId = marker.id;
      saveState();
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-move-marker]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      moveMarkerId = btn.dataset.moveMarker;
      activeMarkerId = moveMarkerId;
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-upload-extra]").forEach(btn => {
    btn.addEventListener("click", () => {
      expandedExtraPanels.add(btn.dataset.uploadExtra);
      const input = document.querySelector('[data-extra-input="' + CSS.escape(btn.dataset.uploadExtra) + '"]');
      input?.click();
    });
  });
  document.querySelectorAll("[data-toggle-extra-panel]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleExtraPanel;
      if (expandedExtraPanels.has(id)) expandedExtraPanels.delete(id);
      else expandedExtraPanels.add(id);
      activeMarkerId = id;
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-system-clipboard]").forEach(btn => {
    btn.addEventListener("click", () => {
      expandedExtraPanels.add(btn.dataset.systemClipboard);
      importSystemClipboardImage(image, btn.dataset.systemClipboard, screen.id, btn);
    });
  });
  document.querySelectorAll("[data-rule-drop]").forEach(card => {
    card.addEventListener("dragover", event => {
      if (!hasImageLikeDragData(event.dataTransfer)) return;
      event.preventDefault();
      expandedExtraPanels.add(card.dataset.ruleDrop);
      card.classList.add("active");
      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.add("drag-over");
    }, true);
    card.addEventListener("dragleave", event => {
      if (card.contains(event.relatedTarget)) return;
      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.remove("drag-over");
    }, true);
    card.addEventListener("drop", event => {
      if (!hasImageLikeDragData(event.dataTransfer)) return;
      event.preventDefault();
      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.remove("drag-over");
      expandedExtraPanels.add(card.dataset.ruleDrop);
      handleDropImageToMarker(image, card.dataset.ruleDrop, event, screen.id, null);
    }, true);
  });
  document.querySelectorAll("[data-extra-attachment]").forEach(box => {
    box.addEventListener("dragover", event => {
      event.preventDefault();
      expandedExtraPanels.add(box.dataset.extraAttachment);
      box.classList.add("drag-over");
    });
    box.addEventListener("dragleave", () => {
      box.classList.remove("drag-over");
    });
    box.addEventListener("drop", event => {
      event.preventDefault();
      box.classList.remove("drag-over");
      expandedExtraPanels.add(box.dataset.extraAttachment);
      handleDropImageToMarker(image, box.dataset.extraAttachment, event, screen.id, null);
    });
  });
  document.querySelectorAll("[data-paste-zone]").forEach(zone => {
    zone.addEventListener("paste", event => handlePasteImageToMarker(image, zone.dataset.pasteZone, event, screen.id, zone));
    zone.addEventListener("keydown", event => {
      if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== "v") return;
      event.preventDefault();
      activeMarkerId = zone.dataset.pasteZone;
      expandedExtraPanels.add(activeMarkerId);
      importSystemClipboardImage(image, activeMarkerId, screen.id, null, zone);
    });
    zone.addEventListener("focus", () => {
      activeMarkerId = zone.dataset.pasteZone;
      saveState();
    });
    zone.addEventListener("dragover", event => {
      event.preventDefault();
      zone.classList.add("drag-over");
      zone.textContent = "松开鼠标添加图片";
    });
    zone.addEventListener("dragleave", () => {
      zone.classList.remove("drag-over");
      zone.textContent = "复制截图后点这里按 Ctrl+V；localhost 模式会自动读取系统剪贴板";
    });
    zone.addEventListener("drop", event => {
      event.preventDefault();
      zone.classList.remove("drag-over");
      handleDropImageToMarker(image, zone.dataset.pasteZone, event, screen.id, zone);
    });
  });
  document.querySelectorAll("[data-extra-note]").forEach(textarea => {
    textarea.addEventListener("input", () => {
      const marker = image.annotations.find(item => item.id === textarea.dataset.extraNote);
      const index = Number(textarea.dataset.extraIndex);
      if (!marker?.extraImages?.[index]) return;
      if (typeof marker.extraImages[index] === "string") marker.extraImages[index] = { src: marker.extraImages[index], note: "" };
      marker.extraImages[index].note = textarea.value;
      saveState();
    });
  });
  document.querySelectorAll("[data-delete-extra]").forEach(btn => {
    btn.addEventListener("click", () => {
      const marker = image.annotations.find(item => item.id === btn.dataset.deleteExtra);
      const index = Number(btn.dataset.extraIndex);
      if (!marker?.extraImages) return;
      marker.extraImages.splice(index, 1);
      activeMarkerId = marker.id;
      saveState();
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-insert-extra-ref]").forEach(btn => {
    btn.addEventListener("click", () => {
      const marker = image.annotations.find(item => item.id === btn.dataset.insertExtraRef);
      const index = Number(btn.dataset.extraIndex);
      const item = marker?.extraImages?.[index];
      if (!marker || !item) return;
      const note = typeof item === "string" ? "" : item.note || "";
      const textarea = document.querySelector('[data-edit-rule="' + CSS.escape(marker.id) + '"]');
      if (!textarea) return;
      const ref = "【效果图" + (index + 1) + (note ? "：" + note : "") + "】";
      replaceTextareaRange(textarea, textarea.selectionStart, textarea.selectionEnd, ref);
      marker.rule = textarea.value;
      saveState();
    });
  });
  document.querySelectorAll("[data-extra-input]").forEach(input => {
    input.addEventListener("change", event => handleExtraUpload(image, input.dataset.extraInput, event, screen.id));
  });
  document.querySelectorAll("[data-rule-display]").forEach(btn => {
    btn.addEventListener("click", () => {
      ruleDisplayMode = btn.dataset.ruleDisplay;
      if (ruleDisplayMode === "point" && !activeMarkerId) {
        activeMarkerId = image.annotations[0]?.id || "0";
      }
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-edit-title]").forEach(input => {
    input.addEventListener("input", () => {
      const marker = image.annotations.find(item => item.id === input.dataset.editTitle);
      marker.title = input.value;
      saveState();
    });
  });
  document.querySelectorAll("[data-edit-rule]").forEach(textarea => {
    textarea.addEventListener("keydown", handleRuleEditorKeydown);
    textarea.addEventListener("input", () => {
      const marker = image.annotations.find(item => item.id === textarea.dataset.editRule);
      marker.rule = textarea.value;
      saveState();
    });
  });
  const entryRule = document.querySelector("[data-entry-rule]");
  if (entryRule) {
    entryRule.addEventListener("keydown", handleRuleEditorKeydown);
    entryRule.addEventListener("input", event => {
      image.entryRule = event.target.value;
      saveState();
    });
  }
  document.querySelector("[data-add-marker]").addEventListener("click", () => addMarker(image, 50, 50, screen.id));
  document.querySelector("[data-renumber-markers]").addEventListener("click", () => {
    const result = renumberMarkersSequential(image);
    if (!result.ok) {
      alert(result.reason || "当前标注不适合自动整理编号。");
      return;
    }
    activeMarkerId = result.idMap.get(activeMarkerId) || activeMarkerId;
    moveMarkerId = moveMarkerId ? result.idMap.get(moveMarkerId) || moveMarkerId : null;
    expandedExtraPanels = remapIdSet(expandedExtraPanels, result.idMap);
    saveState();
    renderDetail(screen.id);
  });
  document.querySelector("[data-save]").addEventListener("click", event => {
    saveStateToLocalFile(event.currentTarget);
  });
  document.querySelectorAll("[data-delete-marker]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const deletedId = btn.dataset.deleteMarker;
      image.annotations = image.annotations.filter(marker => marker.id !== deletedId);
      const result = renumberMarkersSequential(image, { silent: true });
      if (result.ok) {
        activeMarkerId = result.idMap.get(activeMarkerId) || image.annotations[0]?.id || "0";
        moveMarkerId = moveMarkerId ? result.idMap.get(moveMarkerId) || null : null;
        expandedExtraPanels = remapIdSet(expandedExtraPanels, result.idMap);
      } else {
        activeMarkerId = image.annotations[0]?.id || "0";
        moveMarkerId = null;
      }
      moveMarkerId = null;
      saveState();
      renderDetail(screen.id);
    });
  });
  const wrap = document.querySelector("[data-image-wrap]");
  wrap.addEventListener("click", event => {
    if (event.target.closest(".marker")) return;
    const rect = wrap.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 100;
    const y = ((event.clientY - rect.top) / rect.height) * 100;
    if (moveMarkerId) {
      const marker = image.annotations.find(item => item.id === moveMarkerId);
      if (marker) {
        marker.x = Number(Math.max(0, Math.min(100, x)).toFixed(2));
        marker.y = Number(Math.max(0, Math.min(100, y)).toFixed(2));
        activeMarkerId = marker.id;
        moveMarkerId = null;
        saveState();
        renderDetail(screen.id);
      }
      return;
    }
    addMarker(image, Math.max(0, Math.min(100, x)), Math.max(0, Math.min(100, y)), screen.id);
  });
  const upload = document.querySelector("[data-upload-input]");
  document.querySelector("[data-upload-image]").addEventListener("click", () => upload.click());
  upload.addEventListener("change", event => handleUpload(screen, event));
}

function addMarker(image, x, y, screenId) {
  const used = new Set(image.annotations.map(item => item.id));
  let next = 1;
  while (used.has(pad2(next))) next++;
  const id = pad2(next);
  image.annotations.push({
    id,
    x: Number(x.toFixed(2)),
    y: Number(y.toFixed(2)),
    title: "新增标注",
    rule: "待补充：显示规则、点击规则、状态规则。",
  });
  activeMarkerId = id;
  saveState();
  renderDetail(screenId);
}

function renumberMarkersSequential(image, options = {}) {
  const annotations = image.annotations || [];
  const ids = annotations.map(marker => String(marker.id || ""));
  const numericMarkers = annotations.filter(marker => /^\d+$/.test(String(marker.id || "")));
  const numericIds = numericMarkers.map(marker => String(marker.id || ""));
  if (!numericMarkers.length) {
    return { ok: false, reason: "当前没有可整理的数字编号。", idMap: new Map() };
  }
  if (new Set(numericIds).size !== numericIds.length) {
    return { ok: false, reason: "当前存在重复编号，已保留现状，避免破坏同一位置不同状态的标注。", idMap: new Map() };
  }
  const idMap = new Map();
  numericMarkers.forEach((marker, index) => {
    const nextId = pad2(index + 1);
    idMap.set(marker.id, nextId);
    marker.id = nextId;
  });
  return { ok: true, idMap };
}

function remapIdSet(sourceSet, idMap) {
  const next = new Set();
  for (const id of sourceSet || []) next.add(idMap.get(id) || id);
  return next;
}

function jumpToTargetImage(targetValue, sourceMarkerId, fallbackScreen) {
  if (!targetValue) return;
  let targetScreen = fallbackScreen;
  let targetImageId = targetValue;
  if (targetValue.includes("::")) {
    const parts = targetValue.split("::");
    targetScreen = state.interfaces.find(item => item.id === parts[0]) || fallbackScreen;
    targetImageId = parts[1];
  }
  const targetIndex = targetScreen.images.findIndex(img => img.id === targetImageId);
  if (targetIndex < 0) return;
  activeScreenId = targetScreen.id;
  activeImageIndex = targetIndex;
  activeMarkerId = targetScreen.images[targetIndex].annotations.find(item => item.id === sourceMarkerId)?.id || targetScreen.images[targetIndex].annotations[0]?.id || "0";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function replaceTextareaRange(textarea, start, end, value) {
  textarea.value = textarea.value.slice(0, start) + value + textarea.value.slice(end);
  textarea.selectionStart = textarea.selectionEnd = start + value.length;
  textarea.dispatchEvent(new Event("input", { bubbles: true }));
}

function adjustTextareaIndent(textarea, outdent = false) {
  const value = textarea.value;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const lineStart = value.lastIndexOf("\n", start - 1) + 1;
  const lineEnd = end === start ? value.indexOf("\n", end) : end;
  const realLineEnd = lineEnd < 0 ? value.length : lineEnd;
  const block = value.slice(lineStart, realLineEnd);
  const lines = block.split("\n");
  const nextLines = lines.map(line => {
    if (outdent) return line.replace(/^ {1,3}/, "");
    return "   " + line;
  });
  textarea.value = value.slice(0, lineStart) + nextLines.join("\n") + value.slice(realLineEnd);
  const delta = nextLines.join("\n").length - block.length;
  textarea.selectionStart = Math.max(lineStart, start + (outdent ? -Math.min(3, start - lineStart) : 3));
  textarea.selectionEnd = Math.max(textarea.selectionStart, end + delta);
  textarea.dispatchEvent(new Event("input", { bubbles: true }));
}

function handleRuleEditorKeydown(event) {
  const textarea = event.currentTarget;
  if (event.key === "Tab") {
    event.preventDefault();
    adjustTextareaIndent(textarea, event.shiftKey);
    return;
  }
  if (event.key !== "Enter") return;

  const value = textarea.value;
  const cursor = textarea.selectionStart;
  const lineStart = value.lastIndexOf("\n", cursor - 1) + 1;
  const currentLine = value.slice(lineStart, cursor);
  const numbered = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
  const bullet = currentLine.match(/^(\s*)([-*])\s+(.*)$/);

  if (numbered) {
    event.preventDefault();
    if (!numbered[3].trim()) {
      replaceTextareaRange(textarea, lineStart, cursor, "");
      return;
    }
    const next = Number(numbered[2]) + 1;
    replaceTextareaRange(textarea, cursor, cursor, "\n" + numbered[1] + next + ". ");
    return;
  }
  if (bullet) {
    event.preventDefault();
    if (!bullet[3].trim()) {
      replaceTextareaRange(textarea, lineStart, cursor, "");
      return;
    }
    replaceTextareaRange(textarea, cursor, cursor, "\n" + bullet[1] + bullet[2] + " ");
  }
}

function handleUpload(screen, event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    screen.images.push({
      id: screen.id + "-local-" + Date.now(),
      label: "本地图片",
      width: 0,
      height: 0,
      src: reader.result,
      annotations: [{ id: "01", x: 50, y: 50, title: "新增标注", rule: "待补充：显示规则、点击规则、状态规则。" }],
    });
    activeImageIndex = screen.images.length - 1;
    activeMarkerId = "01";
    saveState();
    renderDetail(screen.id);
  };
  reader.readAsDataURL(file);
}

function handleExtraUpload(image, markerId, event, screenId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    addExtraImageToMarker(image, markerId, reader.result, screenId);
  };
  reader.readAsDataURL(file);
}

function addExtraImageToMarker(image, markerId, src, screenId) {
  const marker = image.annotations.find(item => item.id === markerId);
  if (!marker) return;
  marker.extraImages = marker.extraImages || [];
  marker.extraImages.push({ src, note: "" });
  activeMarkerId = marker.id;
  expandedExtraPanels.add(marker.id);
  saveState();
  renderDetail(screenId);
}

function readImageFileToMarker(image, markerId, file, screenId) {
  if (!file) return false;
  const reader = new FileReader();
  reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
  reader.readAsDataURL(file);
  return true;
}

function addDataUrlToMarker(image, markerId, dataUrl, screenId) {
  if (!dataUrl || !dataUrl.startsWith("data:image/")) return false;
  addExtraImageToMarker(image, markerId, dataUrl, screenId);
  return true;
}

function clipboardDebugText(dataTransfer) {
  const files = Array.from(dataTransfer?.files || []).map(file => file.type || file.name || "unknown-file");
  const items = Array.from(dataTransfer?.items || []).map(item => item.type || item.kind || "unknown-item");
  const types = Array.from(dataTransfer?.types || []);
  return files.concat(items, types).filter(Boolean).join(" / ") || "未检测到剪贴板类型";
}

function hasImageLikeDragData(dataTransfer) {
  const files = Array.from(dataTransfer?.files || []);
  if (files.some(file => file.type.startsWith("image/"))) return true;
  const items = Array.from(dataTransfer?.items || []);
  if (items.some(item => item.type.startsWith("image/"))) return true;
  const types = Array.from(dataTransfer?.types || []);
  return types.includes("text/uri-list") || types.includes("text/html");
}

function firstImageUrlFromTransfer(dataTransfer) {
  const uri = dataTransfer?.getData("text/uri-list")?.split("\n").map(line => line.trim()).find(line => line && !line.startsWith("#"));
  if (uri && /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(uri)) return uri;
  const html = dataTransfer?.getData("text/html") || "";
  const srcMatch = html.match(new RegExp('<img[^>]+src=["\']([^"\']+)["\']', 'i'));
  if (srcMatch?.[1]) return srcMatch[1];
  const text = dataTransfer?.getData("text/plain")?.trim() || "";
  if (text && (text.startsWith("data:image/") || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(text))) return text;
  return "";
}

function addImageUrlToMarker(image, markerId, url, screenId, zone) {
  if (!url) return false;
  if (url.startsWith("data:image/")) return addDataUrlToMarker(image, markerId, url, screenId);
  if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("blob:")) {
    fetch(url)
      .then(response => response.blob())
      .then(blob => {
        if (!blob.type.startsWith("image/")) throw new Error("not-image");
        const reader = new FileReader();
        reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
        reader.readAsDataURL(blob);
      })
      .catch(() => {
        const message = "检测到图片链接，但浏览器不允许读取。请改用上传图片。";
        if (zone) zone.textContent = message;
        else alert(message);
      });
    return true;
  }
  return false;
}

function tryReadDefaultPastedImage(image, markerId, screenId, zone) {
  const img = zone.querySelector("img");
  const src = img?.getAttribute("src") || "";
  if (src.startsWith("data:image/")) {
    addDataUrlToMarker(image, markerId, src, screenId);
    return true;
  }
  if (src.startsWith("blob:")) {
    fetch(src)
      .then(response => response.blob())
      .then(blob => {
        const reader = new FileReader();
        reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
        reader.readAsDataURL(blob);
      })
      .catch(() => {
        zone.textContent = "浏览器插入了图片，但无法读取该图片数据。请改用上传图片。";
      });
    return true;
  }
  return false;
}

function handlePasteImageToMarker(image, markerId, event, screenId, zone) {
  const data = event.clipboardData;
  const files = Array.from(data?.files || []).filter(file => file.type.startsWith("image/"));
  if (files[0]) {
    event.preventDefault();
    readImageFileToMarker(image, markerId, files[0], screenId);
    return;
  }

  const items = Array.from(data?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  if (imageItem) {
    const file = imageItem.getAsFile();
    if (file) {
      event.preventDefault();
      readImageFileToMarker(image, markerId, file, screenId);
      return;
    }
    zone.textContent = "检测到图片类型，但浏览器没有提供图片文件。正在尝试默认粘贴...";
    setTimeout(() => {
      if (!tryReadDefaultPastedImage(image, markerId, screenId, zone)) {
        zone.textContent = "检测到图片类型，但无法读取图片数据。请改用上传图片或拖拽图片文件。";
      }
    }, 80);
    return;
  }

  const html = data?.getData("text/html") || "";
  const dataUrlMatch = html.match(new RegExp('<img[^>]+src=["\'](data:image/[^"\']+)["\']', 'i'));
  if (dataUrlMatch) {
    event.preventDefault();
    addDataUrlToMarker(image, markerId, dataUrlMatch[1], screenId);
    return;
  }

  const text = data?.getData("text/plain") || "";
  if (text.startsWith("data:image/")) {
    event.preventDefault();
    addDataUrlToMarker(image, markerId, text.trim(), screenId);
    return;
  }

  setTimeout(() => {
    if (!tryReadDefaultPastedImage(image, markerId, screenId, zone)) {
      zone.textContent = "浏览器没有提供图片，正在尝试读取系统剪贴板...";
      importSystemClipboardImage(image, markerId, screenId, null, zone);
    }
  }, 80);
}

function handleDropImageToMarker(image, markerId, event, screenId, zone) {
  const files = Array.from(event.dataTransfer?.files || []).filter(file => file.type.startsWith("image/"));
  if (files[0]) {
    if (zone) zone.textContent = "正在添加图片...";
    readImageFileToMarker(image, markerId, files[0], screenId);
    return;
  }
  const items = Array.from(event.dataTransfer?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  const itemFile = imageItem?.getAsFile?.();
  if (itemFile) {
    if (zone) zone.textContent = "正在添加图片...";
    readImageFileToMarker(image, markerId, itemFile, screenId);
    return;
  }
  const imageUrl = firstImageUrlFromTransfer(event.dataTransfer);
  if (addImageUrlToMarker(image, markerId, imageUrl, screenId, zone)) {
    if (zone) zone.textContent = "正在添加图片...";
    return;
  }
  if (zone) zone.textContent = "拖入内容不是图片。检测到：" + clipboardDebugText(event.dataTransfer);
  else alert("拖入内容不是图片。检测到：" + clipboardDebugText(event.dataTransfer));
}

async function importSystemClipboardImage(image, markerId, screenId, button, zone) {
  const oldText = button?.textContent;
  if (button) {
    button.textContent = "读取中...";
    button.disabled = true;
  }
  if (zone) zone.textContent = "正在读取系统剪贴板...";
  try {
    const endpoint = location.protocol === "file:" ? "http://127.0.0.1:5177/clipboard-image" : "/clipboard-image";
    const response = await fetch(endpoint, { cache: "no-store" });
    const result = await response.json();
    if (!result.ok || !result.dataUrl) {
      const message = result.message || "系统剪贴板里没有可读取的图片。";
      if (zone) zone.textContent = message;
      else alert(message);
      return;
    }
    if (zone) zone.textContent = "已读取图片，正在添加...";
    addExtraImageToMarker(image, markerId, result.dataUrl, screenId);
  } catch (error) {
    const message = "无法连接本地剪贴板助手。请双击“启动界面规则网页.bat”后使用 localhost 页面，或改用上传图片。";
    if (zone) zone.textContent = message;
    else alert(message);
  } finally {
    if (button) {
      button.textContent = oldText;
      button.disabled = false;
    }
  }
}

async function pasteClipboardImageToMarker(image, markerId, screenId) {
  if (!navigator.clipboard?.read) {
    alert("当前浏览器不支持直接读取剪贴板图片，请使用“上传图片”。");
    return;
  }
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      const imageType = item.types.find(type => type.startsWith("image/"));
      if (!imageType) continue;
      const blob = await item.getType(imageType);
      const reader = new FileReader();
      reader.onload = () => {
        const marker = image.annotations.find(item => item.id === markerId);
        if (!marker) return;
        marker.extraImages = marker.extraImages || [];
        marker.extraImages.push(reader.result);
        activeMarkerId = marker.id;
        saveState();
        renderDetail(screenId);
      };
      reader.readAsDataURL(blob);
      return;
    }
    alert("剪贴板里没有可读取的图片。");
  } catch (error) {
    alert("读取剪贴板图片失败。可以先确认浏览器权限，或改用“上传图片”。");
  }
}

function handlePasteImage(event) {
  const items = Array.from(event.clipboardData?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  if (!activeScreenId || activeMarkerId === "0") return;
  const activeElement = document.activeElement;
  if (!imageItem && activeElement && (activeElement.tagName === "TEXTAREA" || activeElement.tagName === "INPUT" || activeElement.isContentEditable)) return;
  const screen = state.interfaces.find(item => item.id === activeScreenId);
  const image = screen?.images?.[activeImageIndex];
  const marker = image?.annotations?.find(item => item.id === activeMarkerId);
  if (!marker) return;
  event.preventDefault();
  if (!imageItem) {
    importSystemClipboardImage(image, marker.id, screen.id, null, null);
    return;
  }
  const file = imageItem.getAsFile();
  const reader = new FileReader();
  reader.onload = () => {
    addExtraImageToMarker(image, marker.id, reader.result, screen.id);
  };
  reader.readAsDataURL(file);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function escapeAttr(value) { return escapeHtml(value); }

document.querySelector("[data-open-overview]").addEventListener("click", () => {
  activeScreenId = null;
  renderOverview();
  renderNav();
});
byId("exportJsonBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ui-rules-edit-data.json";
  a.click();
  URL.revokeObjectURL(url);
});
byId("importJsonBtn").addEventListener("click", () => byId("importJsonInput").click());
byId("saveTopBtn").addEventListener("click", event => saveStateToLocalFile(event.currentTarget));
byId("publishBtn").addEventListener("click", event => preparePublish(event.currentTarget));
byId("importJsonInput").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state = JSON.parse(reader.result);
    saveState();
    activeScreenId = null;
    render();
  };
  reader.readAsText(file);
});
byId("resetBtn").addEventListener("click", () => {
  if (!confirm("确认恢复初始数据？当前浏览器本地编辑会被清空。")) return;
  localStorage.removeItem(storageKey);
  state = clone(seedData);
  activeScreenId = null;
  render();
});
document.addEventListener("paste", handlePasteImage);

(function(){
  document.body.classList.add('view-only');
  try { localStorage.removeItem('tv-ui-rules-html-prototype-v15'); } catch (error) {}
  function applyViewOnlyMode(){
    document.body.classList.add('view-only');
    document.querySelectorAll('textarea').forEach(function(el){ el.readOnly = true; });
    document.querySelectorAll('input').forEach(function(el){ if (el.type !== 'file') el.readOnly = true; });
    document.querySelectorAll('select').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('.canvas-panel .hint').forEach(function(el){
      el.textContent = '点击截图标注可高亮对应规则；右侧可切换总览或分点查看。';
    });
  }
  var oldRender = render;
  render = function(){ oldRender(); applyViewOnlyMode(); };
  var oldRenderDetail = renderDetail;
  renderDetail = function(screenId){ oldRenderDetail(screenId); applyViewOnlyMode(); };
  var oldRenderOverview = renderOverview;
  renderOverview = function(){ oldRenderOverview(); applyViewOnlyMode(); };
  applyViewOnlyMode();
})();
render();
</script>

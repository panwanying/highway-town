<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>宴会系统 · 界面规则展示版</title>
<style>
:root {
  --bg: #f4f6f3;
  --paper: #fffaf0;
  --panel: #ffffff;
  --ink: #1f2a37;
  --muted: #697386;
  --line: #d7dfdf;
  --brand: #d6523c;
  --brand-dark: #a5372b;
  --sage: #dce9df;
  --sky: #d8eef3;
  --warm: #ffe5ae;
  --shadow: 0 18px 40px rgba(55, 64, 67, .13);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 "Inter", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button {
  border: 0;
  border-radius: 7px;
  padding: 8px 12px;
  background: #23364d;
  color: #fff;
  cursor: pointer;
}
button.secondary { background: #eef2f5; color: #243040; border: 1px solid var(--line); }
button.ghost { background: transparent; color: #2c475d; border: 1px solid var(--line); }
button.danger { background: #b63c32; }
.app {
  display: grid;
  grid-template-columns: 288px 1fr;
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
  padding: 22px 18px;
  background: #182331;
  color: #e9f0f6;
}
.brand {
  padding: 14px 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin-bottom: 18px;
}
.brand .eyebrow { color: #9fb5c9; font-size: 12px; letter-spacing: .05em; }
.brand h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.2; }
.side-title { margin: 18px 8px 8px; color: #9fb5c9; font-size: 12px; }
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0;
  padding: 9px 10px;
  color: #d9e5ef;
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
}
.nav-item:hover, .nav-item.active {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.11);
}
.nav-id {
  min-width: 52px;
  color: #ffd991;
  font-variant-numeric: tabular-nums;
}
.main {
  padding: 34px 38px 70px;
  min-width: 0;
}
.hero {
  padding: 30px 34px;
  border-radius: 16px;
  background: linear-gradient(105deg, var(--warm), #edf0d9 48%, var(--sky));
  box-shadow: var(--shadow);
  margin-bottom: 26px;
}
.hero h2 { margin: 0; font-size: 34px; letter-spacing: 0; }
.hero p { margin: 8px 0 0; color: #4d5d6b; max-width: 880px; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 16px 0 0;
}
.view { display: none; }
.view.active { display: block; }
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}
.overview-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 10px 22px rgba(31,42,55,.06);
  cursor: pointer;
}
.overview-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.overview-card h3 { margin: 0 0 10px; font-size: 18px; }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  background: #eef4f4;
  color: #3d5363;
  font-size: 12px;
  white-space: nowrap;
}
.thumb-strip { display: flex; gap: 8px; overflow: hidden; height: 150px; margin: 12px 0; }
.overview-thumb {
  height: 150px;
  width: auto;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  overflow: hidden;
}
.overview-thumb img {
  height: 150px;
  width: auto;
  border-radius: 8px;
  border: 1px solid #dce3e5;
  background: #f3f5f5;
  display: block;
}
.empty-thumb {
  display: grid;
  place-items: center;
  height: 150px;
  width: 110px;
  border-radius: 8px;
  background: repeating-linear-gradient(135deg, #f1f3f4, #f1f3f4 10px, #e8ecef 10px, #e8ecef 20px);
  color: #7b8794;
}
.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.detail-head h2 { margin: 0; font-size: 28px; }
.screen-block {
  background: var(--paper);
  border: 1px solid #ead9b7;
  border-radius: 14px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 12px 14px 0 rgba(221, 202, 160, .38);
  min-width: 0;
  width: max-content;
  min-width: 100%;
  box-sizing: border-box;
}
.screen-title {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
  padding: 12px 18px;
  border-radius: 10px;
  background: linear-gradient(100deg, #ffe8ac, #edf0d7 48%, #d7eff5);
}
.screen-title h3 { margin: 0; font-size: 20px; }
.workspace {
  display: grid;
  grid-template-columns: minmax(300px, 500px) minmax(320px, 1fr);
  gap: 22px;
  align-items: start;
  min-width: 0;
  background: var(--paper);
  border-radius: 12px;
}
.image-stage {
  background: #f8f1e5;
  border: 1px solid #e3d1ad;
  border-radius: 10px;
  padding: 16px;
  min-width: 0;
}
.image-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.image-tabs button { padding: 6px 10px; background: #e9edf0; color: #2f4050; }
.image-tabs button.active { background: #25384e; color: #fff; }
.image-wrap {
  position: relative;
  display: inline-block;
  max-width: 100%;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #d6dcdd;
}
.image-wrap img {
  display: block;
  max-width: 100%;
  max-height: 760px;
  object-fit: contain;
}
.marker {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  line-height: 1;
  text-align: center;
  font-weight: 800;
  font-size: 13px;
  border: 3px solid #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,.24);
  cursor: pointer;
  touch-action: none;
  user-select: none;
}
.marker.dragging { cursor: grabbing; }
.marker.active { background: #c7352c; outline: 4px solid rgba(255, 207, 87, .95); box-shadow: 0 0 0 7px rgba(255, 207, 87, .24), 0 6px 14px rgba(0,0,0,.28); }
.rule-panel {
  display: grid;
  gap: 12px;
  min-width: 0;
  background: var(--paper);
  border-radius: 12px;
  box-shadow: 0 0 0 12px var(--paper);
}
.rule-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}
.segmented {
  display: inline-flex;
  padding: 3px;
  border-radius: 9px;
  background: #eef2f5;
  border: 1px solid var(--line);
}
.segmented button {
  background: transparent;
  color: #2f4050;
  border-radius: 7px;
  padding: 6px 10px;
}
.segmented button.active {
  background: #23364d;
  color: #fff;
}
.point-tabs {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.point-tabs button {
  background: #fff;
  color: #32465b;
  border: 1px solid #d5dde1;
  min-width: 42px;
  padding: 7px 10px;
}
.point-tabs button.active {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
.rule-panel.mode-point .point-tabs { display: flex; }
.rule-panel.mode-point .rule-card { display: none; }
.rule-panel.mode-point .rule-card.active { display: block; }
.rule-card {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  min-width: 0;
}
.rule-card.active {
  background: #fff3cf;
  border-color: #e09f2d;
  box-shadow: 0 0 0 5px rgba(224,159,45,.28), 0 12px 28px rgba(115, 86, 24, .14);
}
.rule-head {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.rule-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  flex: 0 0 auto;
}
.rule-card input, .rule-card textarea {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fbfcfd;
  color: var(--ink);
}
.rule-card textarea {
  min-height: 180px;
  resize: none;
  overflow: hidden;
}
.rule-text-preview {
  width: 100%;
  min-height: 96px;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 10px 12px;
  background: transparent;
  color: var(--ink);
  white-space: pre-wrap;
  line-height: 1.75;
}
.inline-effect-thumb,
.inline-jump-thumb {
  display: inline-grid;
  grid-template-columns: 38px auto;
  gap: 6px;
  align-items: center;
  max-width: min(240px, 100%);
  margin: 0 3px;
  padding: 3px 7px 3px 3px;
  border: 1px solid #d5dde1;
  border-radius: 999px;
  background: #fff;
  color: #2c475d;
  vertical-align: middle;
  box-shadow: 0 1px 2px rgba(31,42,55,.08);
}
.inline-jump-thumb {
  grid-template-columns: 42px minmax(0, auto);
  border-color: #cbd8e2;
  background: #f8fbff;
}
.inline-effect-thumb img,
.inline-jump-thumb img {
  width: 38px;
  height: 28px;
  object-fit: cover;
  border-radius: 999px;
  border: 1px solid #d5dde1;
  background: #f4f6f7;
}
.inline-jump-thumb img {
  width: 42px;
  height: 32px;
  border-radius: 8px;
}
.inline-effect-thumb span,
.inline-jump-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.inline-jump-text strong {
  margin-right: 5px;
  color: #17324a;
}
.inline-jump-text em {
  color: #496476;
  font-style: normal;
}
.inline-effect-missing,
.inline-jump-missing {
  display: inline-flex;
  margin: 0 3px;
  padding: 2px 7px;
  border: 1px dashed #c8d2d8;
  border-radius: 999px;
  color: #7b8794;
  background: #fbfcfd;
  font-size: 13px;
}
.rule-meta {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto;
  gap: 8px;
  align-items: center;
  margin: 10px 0;
}
.rule-meta select {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fbfcfd;
  color: var(--ink);
}
.action-links {
  margin: 10px 0;
  border: 1px solid #d5dde1;
  border-radius: 10px;
  background: #fbfcfd;
  padding: 10px;
}
.action-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}
.action-list {
  display: grid;
  gap: 8px;
}
.action-row {
  display: grid;
  grid-template-columns: minmax(120px, .6fr) minmax(260px, 1.4fr) auto auto auto;
  gap: 8px;
  align-items: stretch;
}
.action-row input,
.action-row select {
  width: 100%;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  padding: 8px 10px;
  background: #fff;
  color: var(--ink);
}
.action-target-cell {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) minmax(160px, 1.05fr);
  gap: 8px;
  align-items: stretch;
}
.action-target-card {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 8px;
  align-items: center;
  min-width: 0;
  padding: 6px;
  border: 1px solid #d5dde1;
  border-radius: 8px;
  background: #fff;
}
.action-target-thumb {
  width: 42px;
  height: 54px;
  padding: 0;
  overflow: hidden;
  border: 1px solid #d5dde1;
  border-radius: 6px;
  background: #eef2f5;
}
.action-target-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.action-target-title {
  color: var(--ink);
  font-weight: 800;
  font-size: 12px;
  line-height: 1.35;
}
.action-target-meta {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  margin-top: 2px;
}
.action-target-empty {
  display: flex;
  align-items: center;
  min-height: 54px;
  color: #7b8794;
  font-size: 13px;
}
.jump-origin {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin: 0 0 14px;
  padding: 10px 12px;
  border: 1px solid #f1c77f;
  border-radius: 10px;
  background: #fff2cf;
  color: #5d4820;
}
.image-modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(20, 28, 38, .72);
}
.image-modal-card {
  width: min(980px, 96vw);
  max-height: 92vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.image-modal-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.image-modal-body {
  overflow: auto;
  padding: 12px;
  background: #f5f6f3;
}
.image-modal-content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
  gap: 12px;
  align-items: start;
}
.image-modal-body img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
}
.image-modal-note {
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
}
.image-modal-note strong {
  display: block;
  font-size: 13px;
  color: #5c6b7b;
}
.image-modal-note p {
  margin: 0;
  white-space: pre-wrap;
}
.action-empty {
  color: #7b8794;
  font-size: 13px;
}
.extra-attachment {
  margin: 10px 0;
  border: 1px solid #d5dde1;
  border-radius: 10px;
  background: #fbfcfd;
  overflow: hidden;
}
.extra-attachment.drag-over {
  border-color: #2f7d55;
  box-shadow: 0 0 0 4px rgba(47,125,85,.14);
}
.extra-summary {
  display: grid;
  grid-template-columns: auto minmax(120px, 1fr) auto auto auto;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
}
.extra-count {
  font-size: 13px;
  font-weight: 800;
  color: #5c6b7b;
  white-space: nowrap;
}
.extra-preview-strip {
  display: flex;
  gap: 6px;
  min-height: 34px;
  align-items: center;
  overflow: hidden;
}
.extra-preview-btn {
  position: relative;
  width: 42px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  overflow: hidden;
}
.extra-preview-btn img {
  width: 42px;
  height: 32px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #d5dde1;
  background: #f4f6f7;
  display: block;
}
.extra-preview-btn.linked::after {
  content: "";
  position: absolute;
  right: 3px;
  top: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2f7d55;
  box-shadow: 0 0 0 2px #fff;
}
.extra-preview-empty {
  color: #8b97a5;
  font-size: 13px;
}
.extra-panel {
  display: none;
  border-top: 1px solid #d5dde1;
  padding: 10px;
  background: #fff;
}
.extra-attachment.open .extra-panel { display: block; }
.extra-images {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}
.extra-image-card {
  width: 178px;
  padding: 8px;
  border: 1px solid #d5dde1;
  border-radius: 9px;
  background: #fbfcfd;
}
.extra-image-card:first-child {
  border-color: #d6523c;
  box-shadow: 0 0 0 3px rgba(214,82,60,.12);
}
.extra-image-card img {
  width: 100%;
  height: 104px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #d5dde1;
  background: #f4f6f7;
}
.extra-image-preview {
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
}
.extra-ref-status {
  margin-top: 6px;
  padding: 6px 8px;
  border-radius: 7px;
  background: #eef4f4;
  color: #4f6272;
  font-size: 12px;
  line-height: 1.45;
}
.extra-ref-status.linked {
  background: #eaf5ed;
  color: #2f704e;
}
.extra-image-card textarea {
  min-height: 56px;
  margin-top: 6px;
  font-size: 13px;
}
.mini-toolbar {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.mini-toolbar button {
  padding: 5px 8px;
  font-size: 12px;
}
.paste-zone {
  min-height: 38px;
  padding: 8px 10px;
  border: 1px dashed #c8d2d8;
  border-radius: 8px;
  background: #fbfcfd;
  color: #697386;
  outline: none;
}
.paste-zone:focus {
  border-color: #d6523c;
  background: #fff6ef;
  color: #2c3542;
}
.paste-zone.drag-over {
  border-color: #2f7d55;
  background: #eefaf3;
  color: #23543b;
}
.reference-note {
  padding: 18px;
  border: 1px dashed #d5c298;
  border-radius: 10px;
  background: #fff7e7;
  color: #6b5a36;
}
.move-tip {
  display: none;
  margin: 10px 0 0;
  padding: 9px 12px;
  border-radius: 8px;
  background: #fff3cf;
  color: #7a4d06;
  border: 1px solid #efc76b;
}
.move-tip.active { display: block; }
.hint {
  color: var(--muted);
  font-size: 13px;
}
.empty-detail {
  padding: 32px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  background: #fff;
}
.file-input { display: none; }
@media (max-width: 680px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .screen-block { width: 100%; }
  .workspace { grid-template-columns: 1fr; }
  .main { padding: 20px; }
}
</style>
<style>
body.view-only .hero .toolbar,
body.view-only [data-add-marker],
body.view-only [data-renumber-markers],
body.view-only [data-save],
body.view-only [data-delete-marker],
body.view-only [data-move-marker],
body.view-only [data-upload-image],
body.view-only [data-sync-mapping-inline],
body.view-only [data-upload-extra],
body.view-only [data-system-clipboard],
body.view-only [data-add-action],
body.view-only [data-delete-action],
body.view-only [data-insert-action-ref],
body.view-only [data-upload-input],
body.view-only .file-input,
body.view-only .paste-zone,
body.view-only .mini-toolbar,
body.view-only .action-links {
  display: none !important;
}
body.view-only textarea,
body.view-only input,
body.view-only select {
  pointer-events: none;
}
body.view-only textarea,
body.view-only input:not([type='file']) {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  resize: none;
}
body.view-only select {
  opacity: .9;
  background: transparent;
  border-color: transparent;
}
body.view-only .rule-card textarea {
  min-height: 96px;
  overflow: hidden;
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="eyebrow">UI RULES · HTML PROTOTYPE</div>
      <h1>宴会系统</h1>
    </div>
    <button class="nav-item active" data-open-overview><span class="nav-id">总览</span><span>全部界面</span></button>
    <div class="side-title">界面目录</div>
    <div id="navList"></div>
  </aside>
  <main class="main">

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename || (systemSlug + "-edit-data-backup.json");
  a.click();
  URL.revokeObjectURL(url);
}
function saveState() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    lastSaveError = "";
    return true;
  } catch (error) {
    lastSaveError = error?.message || "浏览器本地缓存保存失败。";
    console.warn("localStorage save failed:", error);
    return false;
  }
}
async function saveStateToLocalFile(button, options = {}) {
  const browserSaved = saveState();
  const saveEndpoint = endpoint("/save-state?system=" + encodeURIComponent(systemSlug));
  const oldText = button?.textContent;
  if (button) {
    button.textContent = "保存中...";
    button.disabled = true;
  }
  try {
    const response = await fetch(saveEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state }),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      throw new Error(result.message || "写回本地 HTML 失败。");
    }
    if (!options.silent) {
      alert(result.message + (browserSaved ? "" : "\n浏览器缓存空间不足，已跳过浏览器缓存；不影响重新打开本地 HTML 查看最新内容。"));
    }
    return { ok: true, browserSaved, result };
  } catch (error) {
    const message = (browserSaved ? "已保存到当前浏览器，但" : "浏览器缓存保存失败，且") + "未写回本地 HTML。\n" + (error?.message || "请确认本地服务已启动。");
    if (!options.silent) {
      if (confirm(message + "\n\n是否立刻导出当前编辑数据备份？")) {
        downloadEditData(systemSlug + "-save-failed-backup.json");
      }
    }
    return { ok: false, browserSaved, message };
  } finally {
    if (button) {
      button.textContent = oldText;
      button.disabled = false;
    }
  }
}

async function syncMappingTable(button) {

function pad2(n) { return String(n).padStart(2, "0"); }
function byId(id) { return document.getElementById(id); }
function screenTitle(screen) { return screen.id + " " + screen.name; }
function isViewOnlyMode() { return document.body.classList.contains("view-only"); }
function normalizeMarkerActions(marker) {
  if (!marker) return [];
  const actions = Array.isArray(marker.linkActions) ? marker.linkActions : [];
  marker.linkActions = actions
    .map((action, index) => ({
      label: action?.label || ("点击动作 " + (index + 1)),
      targetImageId: action?.targetImageId || action?.target || "",
    }))
    .filter(action => action.label || action.targetImageId);
  if (!marker.linkActions.length && marker.targetImageId) {
    marker.linkActions.push({ label: "点击动作 1", targetImageId: marker.targetImageId });
  }
  syncLegacyTarget(marker);
  return marker.linkActions;
}
function syncLegacyTarget(marker) {
  if (!marker) return;
  marker.targetImageId = (marker.linkActions || []).find(action => action.targetImageId)?.targetImageId || "";
}
function buildTargetImageOptions(selectedValue) {
  return '<option value="">不跳转</option>' + state.interfaces.map(targetScreen =>
    '<optgroup label="' + escapeAttr(screenTitle(targetScreen)) + '">' +
    targetScreen.images.map((img, index) =>
      '<option value="' + escapeAttr(targetScreen.id + "::" + img.id) + '" ' + (selectedValue === targetScreen.id + "::" + img.id || selectedValue === img.id ? 'selected' : '') + '>' + escapeHtml(screenTitle(targetScreen) + " / " + (img.label || ("界面" + (index + 1))) + " · " + (img.role || "正式界面")) + '</option>'
    ).join("") +
    '</optgroup>'
  ).join("");
}
function resolveTargetImage(targetValue, fallbackScreen) {
  if (!targetValue) return null;
  let targetScreen = fallbackScreen;
  let targetImageId = targetValue;
  if (targetValue.includes("::")) {
    const parts = targetValue.split("::");
    targetScreen = state.interfaces.find(item => item.id === parts[0]) || fallbackScreen;
    targetImageId = parts[1];
  } else {
    targetScreen = state.interfaces.find(screen => (screen.images || []).some(img => img.id === targetValue)) || fallbackScreen;
  }
  const targetIndex = targetScreen?.images?.findIndex(img => img.id === targetImageId) ?? -1;
  if (!targetScreen || targetIndex < 0) return null;
  const image = targetScreen.images[targetIndex];
  return {
    screen: targetScreen,
    image,
    index: targetIndex,
    value: targetScreen.id + "::" + image.id,
    title: screenTitle(targetScreen),
    meta: (image.label || ("界面" + (targetIndex + 1))) + " · " + (image.role || "正式界面"),
  };
}
function renderActionTargetPreview(target, markerId, actionIndex) {
  if (!target) return '<div class="action-target-empty">未选择目标界面</div>';
  return '<div class="action-target-card">' +
    '<button class="action-target-thumb" data-preview-action="' + escapeAttr(markerId) + '" data-action-index="' + actionIndex + '" title="查看大图"><img src="' + escapeAttr(target.image.src) + '" alt="' + escapeAttr(target.title) + '" /></button>' +
    '<div><div class="action-target-title">' + escapeHtml(target.title) + '</div><div class="action-target-meta">' + escapeHtml(target.meta) + '</div></div>' +
  '</div>';
}
function effectRefLabel(index) {
  return "效果图" + (index + 1);
}
function jumpRefLabel(index) {
  return "跳转" + (index + 1);
}
function findEffectReference(marker, index) {
  const label = effectRefLabel(index);
  const lines = String(marker?.rule || "").split("\n");
  const lineIndex = lines.findIndex(line => line.includes("【" + label) || line.includes("[" + label));
  if (lineIndex < 0) return null;
  return {
    label,
    lineNumber: lineIndex + 1,
    text: lines[lineIndex].trim(),
  };
}
function renderRuleTextPreview(marker, fallbackScreen) {
  const text = String(marker?.rule || "");
  const pattern = /(【(效果图|跳转)(\d+)(?:[：:]([^】]+))?】|\[(效果图|跳转)(\d+)(?:[：:]([^\]]+))?\])/g;
  let html = "";
  let lastIndex = 0;
  let match;
  while ((match = pattern.exec(text))) {
    html += escapeHtml(text.slice(lastIndex, match.index));
    const type = match[2] || match[5];
    const numberText = match[3] || match[6];
    const caption = (match[4] || match[7] || "").trim();
    const index = Number(numberText) - 1;
    if (type === "效果图") {
      const item = marker?.extraImages?.[index];
      const label = caption || effectRefLabel(index);
      if (item) {
        const src = typeof item === "string" ? item : item.src;
        html += '<button class="inline-effect-thumb" data-preview-extra="' + escapeAttr(marker.id) + '" data-extra-index="' + index + '">' +
          '<img src="' + escapeAttr(src) + '" alt="' + escapeAttr(label) + '" />' +
          '<span>' + escapeHtml(label) + '</span>' +
        '</button>';
      } else {
        html += '<span class="inline-effect-missing">' + escapeHtml(match[0]) + '</span>';
      }
    } else {
      const action = normalizeMarkerActions(marker)[index];
      const target = resolveTargetImage(action?.targetImageId || "", fallbackScreen);
      const label = caption || action?.label || target?.title || jumpRefLabel(index);
      if (action && target) {
        html += '<button class="inline-jump-thumb" data-inline-jump="' + escapeAttr(marker.id) + '" data-action-index="' + index + '">' +
          '<img src="' + escapeAttr(target.image.src) + '" alt="' + escapeAttr(target.title) + '" />' +
          '<span class="inline-jump-text"><strong>前往</strong><em>' + escapeHtml(label) + '</em></span>' +
        '</button>';
      } else {
        html += '<span class="inline-jump-missing">' + escapeHtml(match[0]) + '</span>';
      }
    }
    lastIndex = pattern.lastIndex;
  }
  html += escapeHtml(text.slice(lastIndex));
  return '<div class="rule-text-preview">' + html + '</div>';
}

function render() {
  renderNav();
  if (activeScreenId) renderDetail(activeScreenId);
  else renderOverview();
}

function renderNav() {
  const nav = byId("navList");
  nav.innerHTML = state.interfaces.map(screen =>
    '<button class="nav-item ' + (screen.id === activeScreenId ? 'active' : '') + '" data-screen="' + escapeAttr(screen.id) + '">' +
    '<span class="nav-id">' + escapeHtml(screen.id) + '</span><span>' + escapeHtml(screen.name) + '</span></button>'
  ).join("");
  nav.querySelectorAll("[data-screen]").forEach(btn => {
    btn.addEventListener("click", () => openDetail(btn.dataset.screen));
  });
}

function renderOverview() {
  activeScreenId = null;
  document.querySelector("[data-open-overview]").classList.add("active");
  byId("overviewView").classList.add("active");
  byId("detailView").classList.remove("active");
  const grid = byId("overviewGrid");
  grid.innerHTML = state.interfaces.map(screen => {
    const thumbs = screen.images.length
      ? screen.images.map((img, index) => '<button class="overview-thumb" data-overview-preview="' + escapeAttr(screen.id) + '" data-image-index="' + index + '" title="查看大图"><img src="' + escapeAttr(img.src) + '" alt="' + escapeAttr(screenTitle(screen) + " / " + (img.label || ("界面" + (index + 1)))) + '" /></button>').join("")
      : '<div class="empty-thumb">待补图</div>';
    return '<article class="overview-card" data-screen="' + escapeAttr(screen.id) + '">' +
      '<h3>' + escapeHtml(screenTitle(screen)) + '</h3>' +
      '<div class="tag-row"><span class="tag">' + escapeHtml(screen.groupId || "未分组") + '</span><span class="tag">' + escapeHtml(screen.status || "待处理") + '</span></div>' +
      '<div class="thumb-strip">' + thumbs + '</div>' +
      '<p class="hint">' + escapeHtml(screen.note || screen.remark || "点击进入界面规则。") + '</p>' +
    '</article>';
  }).join("");
  grid.querySelectorAll("[data-screen]").forEach(card => card.addEventListener("click", () => openDetail(card.dataset.screen)));
  grid.querySelectorAll("[data-overview-preview]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const screen = state.interfaces.find(item => item.id === btn.dataset.overviewPreview);
      const imageIndex = Number(btn.dataset.imageIndex);
      const image = screen?.images?.[imageIndex];
      if (!screen || !image) return;
      openImagePreview(image.src, screenTitle(screen) + " / " + (image.label || ("界面" + (imageIndex + 1))) + " · " + (image.role || "正式界面"));
    });
  });
}

function openDetail(screenId) {
  jumpBackTarget = null;
  activeScreenId = screenId;
  activeImageIndex = 0;
  activeMarkerId = "01";
  document.querySelector("[data-open-overview]").classList.remove("active");
  byId("overviewView").classList.remove("active");
  byId("detailView").classList.add("active");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderDetail(screenId) {
  const screen = state.interfaces.find(item => item.id === screenId);
  const view = byId("detailView");
  if (!screen) {
    view.innerHTML = '<div class="empty-detail">未找到界面。</div>';
    return;
  }
  const image = screen.images[activeImageIndex];
  const jumpOrigin = jumpBackTarget
    ? '<div class="jump-origin"><span>从 ' + escapeHtml(jumpBackTarget.label || "上一界面") + ' 跳转而来</span><button class="ghost" data-return-jump>返回来源</button></div>'
    : "";
  view.innerHTML = '<div class="detail-head">' +
    '<div><h2>' + escapeHtml(screenTitle(screen)) + '</h2><p class="hint">' + escapeHtml(screen.groupName || screen.note || "界面规则展示") + '</p></div>' +
    '<button class="secondary" data-back>返回总览</button>' +
  '</div>' +
  jumpOrigin +
  '<section class="screen-block">' +
    '<div class="screen-title"><h3>' + escapeHtml(screenTitle(screen)) + '</h3><span class="tag">' + escapeHtml(screen.groupId || "未分组") + '</span></div>' +
    (image ? renderImageWorkspace(screen, image) : renderEmptyImage(screen)) +
  '</section>';
  view.querySelector("[data-back]").addEventListener("click", () => { jumpBackTarget = null; activeScreenId = null; renderOverview(); renderNav(); });
  bindDetailEvents(screen);
}

function renderEmptyImage(screen) {
  return '<div class="empty-detail">' +
    '<p>这个界面还没有图片。界面主图需要从映射表同步进来；本地编辑器只维护规则、标点、动作和效果图。</p>' +

  '</div>';
}

  return '<div class="workspace">' +
    '<div class="image-stage">' +
      '<div class="image-tabs">' + tabs + '<button class="secondary" data-sync-mapping-inline>同步映射表</button></div>' +
      '<div class="image-wrap" data-image-wrap><img src="' + image.src + '" alt="' + escapeAttr(screen.name) + '" />' + markers + '</div>' +
      '<div class="move-tip ' + (moveMarkerId ? 'active' : '') + '">正在调整 ' + escapeHtml(moveMarkerId || "") + '：点击截图目标位置，或直接拖动红色标点。</div>' +
      '<p class="hint">点击图片空白处可新增标注；可直接拖动标点调整位置；界面主图、状态图和参考图通过映射表同步，规则卡片内只添加效果图。</p>' +
    '</div>' +
    '<div class="rule-panel mode-' + ruleDisplayMode + '">' +
      '<div class="rule-toolbar">' +
        '<div class="toolbar"><button data-add-marker>新增标注</button><button class="secondary" data-renumber-markers>整理编号</button><button class="secondary" data-save>保存修改</button></div>' +
        '<div class="segmented"><button class="' + (ruleDisplayMode === "overview" ? "active" : "") + '" data-rule-display="overview">总览</button><button class="' + (ruleDisplayMode === "point" ? "active" : "") + '" data-rule-display="point">分点</button></div>' +
      '</div>' +
      '<div class="point-tabs">' + pointTabs + '</div>' +
      (image.role === "参考图" ? '<div class="reference-note">这张图标记为参考图：只用于对标或说明，不生成标点和规则。</div>' : '<div class="rule-card ' + (activeMarkerId === "0" ? "active" : "") + '" data-rule="0"><div class="rule-head"><span class="rule-num">0</span><strong>入口规则</strong></div><textarea data-entry-rule>' + escapeHtml(image.entryRule || "待补充：说明如何进入当前界面。") + '</textarea></div>') +
      rules +
    '</div>' +
  '</div>';
}

function autoGrowTextarea(textarea) {
  if (!textarea) return;
  const minHeight = textarea.hasAttribute("data-extra-note") ? 84 : 180;
  textarea.style.height = "auto";
  textarea.style.height = Math.max(textarea.scrollHeight + 2, minHeight) + "px";
}

function bindAutoGrowTextarea(textarea) {
  autoGrowTextarea(textarea);
  textarea.addEventListener("input", () => autoGrowTextarea(textarea));
}

function bindDetailEvents(screen) {
  const image = screen.images[activeImageIndex];
  if (!image) {
    document.querySelector("[data-sync-mapping-inline]")?.addEventListener("click", event => syncMappingTable(event.currentTarget));
    return;
  }
  document.querySelectorAll("[data-image-index]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeImageIndex = Number(btn.dataset.imageIndex);
      activeMarkerId = screen.images[activeImageIndex].annotations[0]?.id || "01";
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-marker], [data-focus-marker]").forEach(el => {
    el.addEventListener("click", event => {
      event.stopPropagation();
      const id = el.dataset.marker || el.dataset.rule || el.dataset.focusMarker;
      if (id) {
        activeMarkerId = id;
        renderDetail(screen.id);
      }
    });
  });
  document.querySelectorAll("[data-marker]").forEach(markerEl => {
    markerEl.addEventListener("pointerdown", event => {
      if (isViewOnlyMode()) return;
      event.preventDefault();
      event.stopPropagation();
      const marker = image.annotations.find(item => item.id === markerEl.dataset.marker);
      if (!marker) return;
      activeMarkerId = marker.id;
      markerEl.classList.add("dragging");
      markerEl.setPointerCapture(event.pointerId);
      const move = moveEvent => {
        const rect = wrap.getBoundingClientRect();
        const x = ((moveEvent.clientX - rect.left) / rect.width) * 100;
        const y = ((moveEvent.clientY - rect.top) / rect.height) * 100;
        marker.x = Number(Math.max(0, Math.min(100, x)).toFixed(2));
        marker.y = Number(Math.max(0, Math.min(100, y)).toFixed(2));
        markerEl.style.left = marker.x + "%";
        markerEl.style.top = marker.y + "%";
      };
      const up = upEvent => {
        markerEl.classList.remove("dragging");
        markerEl.releasePointerCapture(upEvent.pointerId);
        markerEl.removeEventListener("pointermove", move);
        markerEl.removeEventListener("pointerup", up);
        markerEl.removeEventListener("pointercancel", up);
        moveMarkerId = null;
        saveState();
        renderDetail(screen.id);
      };
      markerEl.addEventListener("pointermove", move);
      markerEl.addEventListener("pointerup", up);
      markerEl.addEventListener("pointercancel", up);
    });
  });
  document.querySelectorAll("[data-rule-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeMarkerId = btn.dataset.ruleTab;
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-action-label]").forEach(input => {
    input.addEventListener("input", () => {
      const marker = image.annotations.find(item => item.id === input.dataset.actionLabel);
      const index = Number(input.dataset.actionIndex);
      const actions = normalizeMarkerActions(marker);
      if (!actions[index]) return;
      actions[index].label = input.value;
      syncLegacyTarget(marker);
      saveState();
    });
  });
  document.querySelectorAll("[data-action-target]").forEach(select => {
    select.addEventListener("change", () => {
      const marker = image.annotations.find(item => item.id === select.dataset.actionTarget);
      const index = Number(select.dataset.actionIndex);
      const actions = normalizeMarkerActions(marker);
      if (!actions[index]) return;
      actions[index].targetImageId = select.value;
      syncLegacyTarget(marker);
      saveState();
      renderDetail(screen.id);
    });
  });
  document.querySelectorAll("[data-preview-action]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      const marker = image.annotations.find(item => item.id === btn.dataset.previewAction);

      const action = normalizeMarkerActions(marker)[index];
      const target = resolveTargetImage(action?.targetImageId || "", screen);

  document.querySelectorAll("[data-preview-extra]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const marker = image.annotations.find(item => item.id === btn.dataset.previewExtra);
      const index = Number(btn.dataset.extraIndex);
      const item = marker?.extraImages?.[index];

        referenceText: ref?.text || "",

  document.querySelectorAll("[data-inline-jump]").forEach(btn => {

  document.querySelectorAll("[data-insert-action-ref]").forEach(btn => {
    btn.addEventListener("click", () => {

  document.querySelectorAll("[data-add-action]").forEach(btn => {

  document.querySelectorAll("[data-move-marker]").forEach(btn => {
    btn.addEventListener("click", event => {

  document.querySelectorAll("[data-upload-extra]").forEach(btn => {

  document.querySelectorAll("[data-toggle-extra-panel]").forEach(btn => {

  document.querySelectorAll("[data-system-clipboard]").forEach(btn => {
    btn.addEventListener("click", () => {
      expandedExtraPanels.add(btn.dataset.systemClipboard);
      importSystemClipboardImage(image, btn.dataset.systemClipboard, screen.id, btn);
    });
  });
  document.querySelectorAll("[data-rule-drop]").forEach(card => {
    card.addEventListener("dragover", event => {
      if (!hasImageLikeDragData(event.dataTransfer)) return;
      event.preventDefault();
      expandedExtraPanels.add(card.dataset.ruleDrop);
      card.classList.add("active");
      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.add("drag-over");
    }, true);
    card.addEventListener("dragleave", event => {
      if (card.contains(event.relatedTarget)) return;
      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.remove("drag-over");
    }, true);
    card.addEventListener("drop", event => {
      if (!hasImageLikeDragData(event.dataTransfer)) return;

      const box = card.querySelector("[data-extra-attachment]");
      box?.classList.remove("drag-over");

      handleDropImageToMarker(image, card.dataset.ruleDrop, event, screen.id, null);
    }, true);
  });
  document.querySelectorAll("[data-extra-attachment]").forEach(box => {
    box.addEventListener("dragover", event => {
      event.preventDefault();
      expandedExtraPanels.add(box.dataset.extraAttachment);

    });
    box.addEventListener("dragleave", () => {
      box.classList.remove("drag-over");

    box.addEventListener("drop", event => {
      event.preventDefault();
      box.classList.remove("drag-over");
      expandedExtraPanels.add(box.dataset.extraAttachment);
      handleDropImageToMarker(image, box.dataset.extraAttachment, event, screen.id, null);

  document.querySelectorAll("[data-paste-zone]").forEach(zone => {
    zone.addEventListener("paste", event => handlePasteImageToMarker(image, zone.dataset.pasteZone, event, screen.id, zone));
    zone.addEventListener("keydown", event => {
      if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== "v") return;

      expandedExtraPanels.add(activeMarkerId);
      importSystemClipboardImage(image, activeMarkerId, screen.id, null, zone);
    });
    zone.addEventListener("focus", () => {
      activeMarkerId = zone.dataset.pasteZone;

    });
    zone.addEventListener("dragover", event => {

    });
    zone.addEventListener("dragleave", () => {

    });
    zone.addEventListener("drop", event => {
      event.preventDefault();
      zone.classList.remove("drag-over");

  document.querySelectorAll("[data-extra-note]").forEach(textarea => {

  document.querySelectorAll("[data-rule-display]").forEach(btn => {

      ruleDisplayMode = btn.dataset.ruleDisplay;

  document.querySelectorAll("[data-edit-title]").forEach(input => {

  const returnJump = document.querySelector("[data-return-jump]");

    const result = renumberMarkersSequential(image);

      alert(result.reason || "当前标注不适合自动整理编号。");
      return;
    }
    activeMarkerId = result.idMap.get(activeMarkerId) || activeMarkerId;
    moveMarkerId = moveMarkerId ? result.idMap.get(moveMarkerId) || moveMarkerId : null;

  document.querySelector("[data-save]").addEventListener("click", event => {

  });
  document.querySelectorAll("[data-sync-mapping-inline]").forEach(btn => {

  document.querySelectorAll("[data-delete-marker]").forEach(btn => {
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      const deletedId = btn.dataset.deleteMarker;
      image.annotations = image.annotations.filter(marker => marker.id !== deletedId);
      const result = renumberMarkersSequential(image, { silent: true });
      if (result.ok) {
        activeMarkerId = result.idMap.get(activeMarkerId) || image.annotations[0]?.id || "0";
        moveMarkerId = moveMarkerId ? result.idMap.get(moveMarkerId) || null : null;
        expandedExtraPanels = remapIdSet(expandedExtraPanels, result.idMap);
      } else {
        activeMarkerId = image.annotations[0]?.id || "0";

      }
      moveMarkerId = null;
      saveState();

    if (event.target.closest(".marker")) return;
    if (isViewOnlyMode()) return;
    const rect = wrap.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 100;
    const y = ((event.clientY - rect.top) / rect.height) * 100;
    if (moveMarkerId) {
      const marker = image.annotations.find(item => item.id === moveMarkerId);
      if (marker) {
        marker.x = Number(Math.max(0, Math.min(100, x)).toFixed(2));
        marker.y = Number(Math.max(0, Math.min(100, y)).toFixed(2));
        activeMarkerId = marker.id;
        moveMarkerId = null;
        saveState();
        renderDetail(screen.id);
      }
      return;
    }
    addMarker(image, Math.max(0, Math.min(100, x)), Math.max(0, Math.min(100, y)), screen.id);
  });
}

function addMarker(image, x, y, screenId) {
  const used = new Set(image.annotations.map(item => item.id));
  let next = 1;
  while (used.has(pad2(next))) next++;
  const id = pad2(next);
  image.annotations.push({
    id,
    x: Number(x.toFixed(2)),
    y: Number(y.toFixed(2)),
    title: "新增标注",
    rule: "待补充：显示规则、点击规则、状态规则。",
  });
  activeMarkerId = id;
  saveState();
  renderDetail(screenId);
}

function renumberMarkersSequential(image, options = {}) {
  const annotations = image.annotations || [];
  const ids = annotations.map(marker => String(marker.id || ""));
  const numericMarkers = annotations.filter(marker => /^\d+$/.test(String(marker.id || "")));
  const numericIds = numericMarkers.map(marker => String(marker.id || ""));
  if (!numericMarkers.length) {
    return { ok: false, reason: "当前没有可整理的数字编号。", idMap: new Map() };
  }
  if (new Set(numericIds).size !== numericIds.length) {
    return { ok: false, reason: "当前存在重复编号，已保留现状，避免破坏同一位置不同状态的标注。", idMap: new Map() };
  }
  const idMap = new Map();
  numericMarkers.forEach((marker, index) => {
    const nextId = pad2(index + 1);
    idMap.set(marker.id, nextId);
    marker.id = nextId;
  });
  return { ok: true, idMap };
}

function remapIdSet(sourceSet, idMap) {
  const next = new Set();
  for (const id of sourceSet || []) next.add(idMap.get(id) || id);
  return next;
}

function openImagePreview(src, title, context = {}) {
  const old = document.querySelector(".image-modal");
  old?.remove();
  const noteParts = [];
  if (context.referenceText) {
    noteParts.push('<div><strong>关联正文</strong><p>' + escapeHtml(context.referenceText) + '</p></div>');
  }
  if (context.note) {
    noteParts.push('<div><strong>效果说明</strong><p>' + escapeHtml(context.note) + '</p></div>');
  }
  if (!noteParts.length && context.emptyText) {
    noteParts.push('<div><strong>关联正文</strong><p>' + escapeHtml(context.emptyText) + '</p></div>');
  }
  const sideNote = noteParts.length ? '<aside class="image-modal-note">' + noteParts.join("") + '</aside>' : "";
  const modal = document.createElement("div");
  modal.className = "image-modal";
  modal.innerHTML = '<div class="image-modal-card" role="dialog" aria-modal="true">' +
    '<div class="image-modal-head"><strong>' + escapeHtml(title || "查看图片") + '</strong><button class="ghost" data-close-image-modal>关闭</button></div>' +
    '<div class="image-modal-body"><div class="image-modal-content"><img src="' + escapeAttr(src) + '" alt="' + escapeAttr(title || "查看图片") + '" />' + sideNote + '</div></div>' +
  '</div>';
  modal.addEventListener("click", event => {
    if (event.target === modal || event.target.closest("[data-close-image-modal]")) modal.remove();
  });
  document.addEventListener("keydown", function closeOnEsc(event) {
    if (event.key !== "Escape") return;
    modal.remove();
    document.removeEventListener("keydown", closeOnEsc);
  });
  document.body.appendChild(modal);
}

function jumpToTargetImage(targetValue, sourceMarkerId, fallbackScreen, actionLabel = "") {
  if (!targetValue) return;
  const target = resolveTargetImage(targetValue, fallbackScreen);
  if (!target) return;
  const sourceScreen = state.interfaces.find(item => item.id === activeScreenId) || fallbackScreen;
  const sourceImage = sourceScreen?.images?.[activeImageIndex];
  const sourceMarker = sourceImage?.annotations?.find(item => item.id === sourceMarkerId);
  jumpBackTarget = {
    screenId: sourceScreen.id,
    imageIndex: activeImageIndex,
    markerId: sourceMarkerId,
    label: screenTitle(sourceScreen) + " / " + (sourceImage?.label || "当前图片") + " / " + sourceMarkerId + (sourceMarker?.title ? " " + sourceMarker.title : "") + (actionLabel ? " / " + actionLabel : ""),
  };
  const targetScreen = target.screen;
  const targetIndex = target.index;
  activeScreenId = targetScreen.id;
  activeImageIndex = targetIndex;
  activeMarkerId = targetScreen.images[targetIndex].annotations.find(item => item.id === sourceMarkerId)?.id || targetScreen.images[targetIndex].annotations[0]?.id || "0";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function replaceTextareaRange(textarea, start, end, value) {
  textarea.value = textarea.value.slice(0, start) + value + textarea.value.slice(end);
  textarea.selectionStart = textarea.selectionEnd = start + value.length;
  textarea.dispatchEvent(new Event("input", { bubbles: true }));
}

function adjustTextareaIndent(textarea, outdent = false) {
  const value = textarea.value;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const lineStart = value.lastIndexOf("\n", start - 1) + 1;
  const lineEnd = end === start ? value.indexOf("\n", end) : end;
  const realLineEnd = lineEnd < 0 ? value.length : lineEnd;
  const block = value.slice(lineStart, realLineEnd);
  const lines = block.split("\n");
  const nextLines = lines.map(line => {
    if (outdent) return line.replace(/^ {1,3}/, "");
    return "   " + line;
  });
  textarea.value = value.slice(0, lineStart) + nextLines.join("\n") + value.slice(realLineEnd);
  const delta = nextLines.join("\n").length - block.length;
  textarea.selectionStart = Math.max(lineStart, start + (outdent ? -Math.min(3, start - lineStart) : 3));
  textarea.selectionEnd = Math.max(textarea.selectionStart, end + delta);
  textarea.dispatchEvent(new Event("input", { bubbles: true }));
}

function handleRuleEditorKeydown(event) {
  const textarea = event.currentTarget;
  if (event.key === "Tab") {
    event.preventDefault();
    adjustTextareaIndent(textarea, event.shiftKey);
    return;
  }
  if (event.key !== "Enter") return;

  const value = textarea.value;
  const cursor = textarea.selectionStart;
  const lineStart = value.lastIndexOf("\n", cursor - 1) + 1;
  const currentLine = value.slice(lineStart, cursor);
  const numbered = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
  const bullet = currentLine.match(/^(\s*)([-*])\s+(.*)$/);

  if (numbered) {
    event.preventDefault();
    if (!numbered[3].trim()) {
      replaceTextareaRange(textarea, lineStart, cursor, "");
      return;
    }
    const next = Number(numbered[2]) + 1;
    replaceTextareaRange(textarea, cursor, cursor, "\n" + numbered[1] + next + ". ");
    return;
  }
  if (bullet) {
    event.preventDefault();
    if (!bullet[3].trim()) {
      replaceTextareaRange(textarea, lineStart, cursor, "");
      return;
    }
    replaceTextareaRange(textarea, cursor, cursor, "\n" + bullet[1] + bullet[2] + " ");
  }
}

function handleUpload(screen, event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    screen.images.push({
      id: screen.id + "-local-" + Date.now(),
      label: "本地图片",
      width: 0,
      height: 0,
      src: reader.result,
      annotations: [{ id: "01", x: 50, y: 50, title: "新增标注", rule: "待补充：显示规则、点击规则、状态规则。" }],
    });
    activeImageIndex = screen.images.length - 1;
    activeMarkerId = "01";
    saveState();
    renderDetail(screen.id);
  };
  reader.readAsDataURL(file);
}

function handleExtraUpload(image, markerId, event, screenId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    addExtraImageToMarker(image, markerId, reader.result, screenId);
  };
  reader.readAsDataURL(file);
}

function addExtraImageToMarker(image, markerId, src, screenId) {
  const marker = image.annotations.find(item => item.id === markerId);
  if (!marker) return;
  marker.extraImages = marker.extraImages || [];
  marker.extraImages.push({ src, note: "" });
  activeMarkerId = marker.id;
  expandedExtraPanels.add(marker.id);
  saveState();
  renderDetail(screenId);
}

function readImageFileToMarker(image, markerId, file, screenId) {
  if (!file) return false;
  const reader = new FileReader();
  reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
  reader.readAsDataURL(file);
  return true;
}

function addDataUrlToMarker(image, markerId, dataUrl, screenId) {
  if (!dataUrl || !dataUrl.startsWith("data:image/")) return false;
  addExtraImageToMarker(image, markerId, dataUrl, screenId);
  return true;
}

function clipboardDebugText(dataTransfer) {
  const files = Array.from(dataTransfer?.files || []).map(file => file.type || file.name || "unknown-file");
  const items = Array.from(dataTransfer?.items || []).map(item => item.type || item.kind || "unknown-item");
  const types = Array.from(dataTransfer?.types || []);
  return files.concat(items, types).filter(Boolean).join(" / ") || "未检测到剪贴板类型";
}

function hasImageLikeDragData(dataTransfer) {
  const files = Array.from(dataTransfer?.files || []);
  if (files.some(file => file.type.startsWith("image/"))) return true;
  const items = Array.from(dataTransfer?.items || []);
  if (items.some(item => item.type.startsWith("image/"))) return true;
  const types = Array.from(dataTransfer?.types || []);
  return types.includes("text/uri-list") || types.includes("text/html");
}

function firstImageUrlFromTransfer(dataTransfer) {
  const uri = dataTransfer?.getData("text/uri-list")?.split("\n").map(line => line.trim()).find(line => line && !line.startsWith("#"));
  if (uri && /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(uri)) return uri;
  const html = dataTransfer?.getData("text/html") || "";
  const srcMatch = html.match(new RegExp('<img[^>]+src=["\']([^"\']+)["\']', 'i'));
  if (srcMatch?.[1]) return srcMatch[1];
  const text = dataTransfer?.getData("text/plain")?.trim() || "";
  if (text && (text.startsWith("data:image/") || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(text))) return text;
  return "";
}

function addImageUrlToMarker(image, markerId, url, screenId, zone) {
  if (!url) return false;
  if (url.startsWith("data:image/")) return addDataUrlToMarker(image, markerId, url, screenId);
  if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("blob:")) {
    fetch(url)
      .then(response => response.blob())
      .then(blob => {
        if (!blob.type.startsWith("image/")) throw new Error("not-image");
        const reader = new FileReader();
        reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
        reader.readAsDataURL(blob);
      })
      .catch(() => {
        const message = "检测到图片链接，但浏览器不允许读取。请改用上传图片。";
        if (zone) zone.textContent = message;
        else alert(message);
      });
    return true;
  }
  return false;
}

function tryReadDefaultPastedImage(image, markerId, screenId, zone) {
  const img = zone.querySelector("img");
  const src = img?.getAttribute("src") || "";
  if (src.startsWith("data:image/")) {
    addDataUrlToMarker(image, markerId, src, screenId);
    return true;
  }
  if (src.startsWith("blob:")) {
    fetch(src)
      .then(response => response.blob())
      .then(blob => {
        const reader = new FileReader();
        reader.onload = () => addExtraImageToMarker(image, markerId, reader.result, screenId);
        reader.readAsDataURL(blob);
      })
      .catch(() => {
        zone.textContent = "浏览器插入了图片，但无法读取该图片数据。请改用上传图片。";
      });
    return true;
  }
  return false;
}

function handlePasteImageToMarker(image, markerId, event, screenId, zone) {
  const data = event.clipboardData;
  const files = Array.from(data?.files || []).filter(file => file.type.startsWith("image/"));
  if (files[0]) {
    event.preventDefault();
    readImageFileToMarker(image, markerId, files[0], screenId);
    return;
  }

  const items = Array.from(data?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  if (imageItem) {
    const file = imageItem.getAsFile();
    if (file) {
      event.preventDefault();
      readImageFileToMarker(image, markerId, file, screenId);
      return;
    }
    zone.textContent = "检测到图片类型，但浏览器没有提供图片文件。正在尝试默认粘贴...";
    setTimeout(() => {
      if (!tryReadDefaultPastedImage(image, markerId, screenId, zone)) {
        zone.textContent = "检测到图片类型，但无法读取图片数据。请改用上传图片或拖拽图片文件。";
      }
    }, 80);
    return;
  }

  const html = data?.getData("text/html") || "";
  const dataUrlMatch = html.match(new RegExp('<img[^>]+src=["\'](data:image/[^"\']+)["\']', 'i'));
  if (dataUrlMatch) {
    event.preventDefault();
    addDataUrlToMarker(image, markerId, dataUrlMatch[1], screenId);
    return;
  }

  const text = data?.getData("text/plain") || "";
  if (text.startsWith("data:image/")) {
    event.preventDefault();
    addDataUrlToMarker(image, markerId, text.trim(), screenId);
    return;
  }

  setTimeout(() => {
    if (!tryReadDefaultPastedImage(image, markerId, screenId, zone)) {
      zone.textContent = "浏览器没有提供图片，正在尝试读取系统剪贴板...";
      importSystemClipboardImage(image, markerId, screenId, null, zone);
    }
  }, 80);
}

function handleDropImageToMarker(image, markerId, event, screenId, zone) {
  const files = Array.from(event.dataTransfer?.files || []).filter(file => file.type.startsWith("image/"));
  if (files[0]) {
    if (zone) zone.textContent = "正在添加图片...";
    readImageFileToMarker(image, markerId, files[0], screenId);
    return;
  }
  const items = Array.from(event.dataTransfer?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  const itemFile = imageItem?.getAsFile?.();
  if (itemFile) {
    if (zone) zone.textContent = "正在添加图片...";
    readImageFileToMarker(image, markerId, itemFile, screenId);
    return;
  }
  const imageUrl = firstImageUrlFromTransfer(event.dataTransfer);
  if (addImageUrlToMarker(image, markerId, imageUrl, screenId, zone)) {
    if (zone) zone.textContent = "正在添加图片...";
    return;
  }
  if (zone) zone.textContent = "拖入内容不是图片。检测到：" + clipboardDebugText(event.dataTransfer);
  else alert("拖入内容不是图片。检测到：" + clipboardDebugText(event.dataTransfer));
}

async function importSystemClipboardImage(image, markerId, screenId, button, zone) {
  const oldText = button?.textContent;
  if (button) {
    button.textContent = "读取中...";
    button.disabled = true;
  }
  if (zone) zone.textContent = "正在读取系统剪贴板...";
  try {
    const endpoint = location.protocol === "file:" ? "http://127.0.0.1:5177/clipboard-image" : "/clipboard-image";
    const response = await fetch(endpoint, { cache: "no-store" });
    const result = await response.json();
    if (!result.ok || !result.dataUrl) {
      const message = result.message || "系统剪贴板里没有可读取的图片。";
      if (zone) zone.textContent = message;
      else alert(message);
      return;
    }
    if (zone) zone.textContent = "已读取图片，正在添加...";
    addExtraImageToMarker(image, markerId, result.dataUrl, screenId);
  } catch (error) {
    const message = "无法连接本地剪贴板助手。请双击“启动界面规则网页.bat”后使用 localhost 页面，或改用上传图片。";
    if (zone) zone.textContent = message;
    else alert(message);
  } finally {
    if (button) {
      button.textContent = oldText;
      button.disabled = false;
    }
  }
}

async function pasteClipboardImageToMarker(image, markerId, screenId) {
  if (!navigator.clipboard?.read) {
    alert("当前浏览器不支持直接读取剪贴板图片，请使用“上传图片”。");
    return;
  }
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      const imageType = item.types.find(type => type.startsWith("image/"));
      if (!imageType) continue;
      const blob = await item.getType(imageType);
      const reader = new FileReader();
      reader.onload = () => {
        const marker = image.annotations.find(item => item.id === markerId);
        if (!marker) return;
        marker.extraImages = marker.extraImages || [];
        marker.extraImages.push(reader.result);
        activeMarkerId = marker.id;
        saveState();
        renderDetail(screenId);
      };
      reader.readAsDataURL(blob);
      return;
    }
    alert("剪贴板里没有可读取的图片。");
  } catch (error) {
    alert("读取剪贴板图片失败。可以先确认浏览器权限，或改用“上传图片”。");
  }
}

function handlePasteImage(event) {
  const items = Array.from(event.clipboardData?.items || []);
  const imageItem = items.find(item => item.type.startsWith("image/"));
  if (!activeScreenId || activeMarkerId === "0") return;
  const activeElement = document.activeElement;
  if (!imageItem && activeElement && (activeElement.tagName === "TEXTAREA" || activeElement.tagName === "INPUT" || activeElement.isContentEditable)) return;
  const screen = state.interfaces.find(item => item.id === activeScreenId);
  const image = screen?.images?.[activeImageIndex];
  const marker = image?.annotations?.find(item => item.id === activeMarkerId);
  if (!marker) return;
  event.preventDefault();
  if (!imageItem) {
    importSystemClipboardImage(image, marker.id, screen.id, null, null);
    return;
  }
  const file = imageItem.getAsFile();
  const reader = new FileReader();
  reader.onload = () => {
    addExtraImageToMarker(image, marker.id, reader.result, screen.id);
  };
  reader.readAsDataURL(file);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function escapeAttr(value) { return escapeHtml(value); }

  activeScreenId = null;
  renderOverview();
  renderNav();
});

  downloadEditData(systemSlug + "-edit-data-backup.json");
});

byId("syncMappingBtn").addEventListener("click", event => syncMappingTable(event.currentTarget));
byId("buildPreviewBtn").addEventListener("click", event => buildLocalPreview(event.currentTarget));
byId("openPreviewBtn").addEventListener("click", openLocalPreview);

byId("importJsonInput").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state = JSON.parse(reader.result);
    saveState();
    activeScreenId = null;
    render();
  };
  reader.readAsText(file);
});
byId("resetBtn").addEventListener("click", () => {
  if (!confirm("确认恢复初始数据？当前浏览器本地编辑会被清空。")) return;
  localStorage.removeItem(storageKey);
  state = clone(seedData);
  activeScreenId = null;
  render();
});
document.addEventListener("paste", handlePasteImage);

(function(){
  document.body.classList.add('view-only');
  try { localStorage.removeItem("banquet-ui-rules-editor-v1"); } catch (error) {}
  function applyViewOnlyMode(){
    document.body.classList.add('view-only');
    document.querySelectorAll('textarea').forEach(function(el){
      el.readOnly = true;
      el.style.height = 'auto';
      el.style.height = Math.max(el.scrollHeight, 96) + 'px';
      el.style.overflow = 'hidden';
    });
    document.querySelectorAll('input').forEach(function(el){ if (el.type !== 'file') el.readOnly = true; });
    document.querySelectorAll('select').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('.canvas-panel .hint').forEach(function(el){
      el.textContent = '点击截图标注可高亮对应规则；右侧可切换总览或分点查看。';
    });
  }
  var oldRender = render;
  render = function(){ oldRender(); applyViewOnlyMode(); };
  var oldRenderDetail = renderDetail;
  renderDetail = function(screenId){ oldRenderDetail(screenId); applyViewOnlyMode(); };
  var oldRenderOverview = renderOverview;
  renderOverview = function(){ oldRenderOverview(); applyViewOnlyMode(); };
  applyViewOnlyMode();
})();
render();
